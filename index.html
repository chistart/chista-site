<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chista — generative paintings</title>
<meta name="description" content="Chista is a painter, illustrator and architect who works in code: generative series that begin by hand, each with its own engine for watercolour, pastel, ink, etching, wool or oil.">
<meta property="og:title" content="Chista — generative paintings">
<meta property="og:description" content="Paintings that begin by hand and finish in code.">
<meta property="og:image" content="https://chista.design/img/divoni-0.jpg">
<meta property="og:url" content="https://chista.design/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@chistaai">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Shippori+Mincho:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--disp:'Cormorant Garamond','Shippori Mincho',serif;--ui:'Jost',system-ui,sans-serif;--paper:#F5F2EC;--ink:#1B1917;--mute:#8A8076;--soft:#4B443D;--red:#B0322A;--night:#0E0D0C;--nightInk:#EDE7DD;--nightMute:#9C9285;--ease:cubic-bezier(.76,0,.24,1);--out:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .9s var(--ease),color .9s var(--ease)}
body.dark{background:var(--night);color:var(--nightInk)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
img,video{display:block}
.serif{font-family:var(--disp);font-weight:400}
/* header */
header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:22px clamp(18px,3.2vw,44px);pointer-events:none}
header>*{pointer-events:auto}
.logo{display:flex;align-items:center;gap:12px}
.seal{width:32px;height:32px;background:var(--red);color:#F5F2EC;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:12px;line-height:1.05;text-align:center;border-radius:2px}
.logo b{font-family:var(--disp);font-weight:400;font-size:22px;letter-spacing:.06em}
nav{display:flex;gap:clamp(16px,2.4vw,34px);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
nav a{position:relative;padding:6px 0}
nav a::after{content:'';position:absolute;left:0;right:100%;bottom:0;height:1px;background:currentColor;transition:right .5s var(--out)}
nav a:hover::after,nav a.on::after{right:0}
nav a.mint{color:var(--red)}
body.dark nav a.mint{color:#E46A5E}
.sealimg{width:34px;height:auto}
.sigimg{height:40px;width:auto;margin-top:12px}
body.dark .sigimg{filter:invert(1)}
/* intro */
#intro{position:fixed;inset:0;z-index:90;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:transform 1.2s var(--ease)}
#intro.up{transform:translateY(-100%)}
#intro .sigbox{position:relative;height:100%;aspect-ratio:1285/1400;overflow:hidden;-webkit-mask-image:url(sig.png);mask-image:url(sig.png);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:100% 100%;mask-size:100% 100%}
@keyframes write{to{clip-path:inset(-2% -20% -2% 0)}}
#intro .ink{position:absolute;inset:-12%;filter:url(#liquid) saturate(1.25)}
#intro .ink img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
#intro .ink img:nth-child(1){animation:flowA 9s ease-in-out infinite alternate,fade 9s ease-in-out infinite}
#intro .ink img:nth-child(2){animation:flowB 9s ease-in-out infinite alternate,fade 9s ease-in-out -3s infinite}
#intro .ink img:nth-child(3){animation:flowC 9s ease-in-out infinite alternate,fade 9s ease-in-out -6s infinite}
#intro .ink img:nth-child(4){opacity:1;animation:flowB 12s ease-in-out infinite alternate}
#intro .ink img:nth-child(1),#intro .ink img:nth-child(2),#intro .ink img:nth-child(3){z-index:1}
@keyframes fade{0%,100%{opacity:0}30%,70%{opacity:.95}}
@keyframes flowA{from{transform:scale(1.1) rotate(-6deg) translate(-6%,4%)}to{transform:scale(1.35) rotate(8deg) translate(7%,-5%)}}
@keyframes flowB{from{transform:scale(1.3) rotate(10deg) translate(5%,6%)}to{transform:scale(1.05) rotate(-4deg) translate(-8%,-3%)}}
@keyframes flowC{from{transform:scale(1.15) rotate(0) translate(0,-7%)}to{transform:scale(1.4) rotate(14deg) translate(-4%,8%)}}
#intro .sigwrap{height:min(54vh,80vw);aspect-ratio:1285/1400;transform-origin:0 0}
@keyframes sigIn{to{opacity:1;filter:blur(0);transform:none}}
#intro.out .sigwrap{transition:transform 1.3s cubic-bezier(.65,0,.25,1),opacity .5s ease .9s}#intro.out .sigwrap.gone{opacity:0}
#intro.fade{opacity:0;transition:opacity 1.4s ease}
#intro .sigwrap{position:relative}
#intro.out{background:transparent;transition:background .9s ease .3s}
#intro.out p,#intro.out .seal2{opacity:0!important;transition:opacity .4s}
#intro .seal2{position:absolute;width:8%;right:-2%;bottom:6%;top:auto;opacity:0;animation:stamp .6s var(--out) 2.2s forwards}
@keyframes stamp{from{opacity:0;transform:scale(1.6) rotate(-8deg)}to{opacity:1;transform:none}}
#intro p{position:absolute;bottom:28px;margin:0;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);opacity:0;animation:fadein 1s ease 2.6s forwards}
@keyframes fadein{to{opacity:1}}
/* reveal helpers */
.mask{display:block;overflow:hidden}
.mask>span{display:inline-block;transform:translateY(105%);transition:transform 1.1s var(--out)}
.in .mask>span{transform:none}
.rise{opacity:0;transform:translateY(28px);transition:opacity 1s var(--out),transform 1.1s var(--out)}
.in .rise{opacity:1;transform:none}
/* ===== showcase ===== */
#show{position:fixed;inset:0;overflow:hidden;background:var(--paper)}
#show .bg{position:absolute;inset:0;transition:background 1.4s var(--ease)}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);align-items:center;gap:clamp(20px,4vw,70px);padding:96px clamp(18px,4vw,64px) 84px;pointer-events:none}
.slide.cur{pointer-events:auto}
.slide .meta{display:flex;flex-direction:column;gap:18px;align-self:end;padding-bottom:10px;min-width:0}
.slide .num{font-size:12px;letter-spacing:.2em;color:var(--mute)}
.slide h2{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(46px,7.4vw,126px);line-height:.98;letter-spacing:-.01em}
.slide h2 .mask>span{transition-duration:1.2s}
.slide h2,.ptxt h1,.nextp b,.ih h1,.sec h2{font-weight:500!important;letter-spacing:-.015em}
.slide .sub{font-family:var(--disp);font-size:clamp(18px,2vw,26px);color:var(--soft)}
.slide .ln{margin:0;max-width:440px;font-family:var(--disp);font-style:italic;font-size:21px;line-height:1.6;color:var(--soft)}
.slide .acts{display:flex;flex-wrap:wrap;gap:12px;padding-top:6px}
.pill{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border:1px solid currentColor;border-radius:40px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;transition:background .4s,color .4s}
.pill:hover{background:var(--ink);color:var(--paper)}
.pill.red{background:var(--red);border-color:var(--red);color:#F5F2EC}
.slide .art{height:100%;min-height:0;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.slide .art .wrapi{height:100%;width:100%;display:flex;align-items:center;justify-content:center;clip-path:inset(100% 0 0 0);transform:translateY(12%);transition:clip-path 1.25s var(--ease),transform 1.4s var(--ease)}
.slide .art img,.slide .art video{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 40px 90px -30px rgba(40,30,20,.45);transform:scale(1.08);transition:transform 2.2s var(--out)}
.slide.cur .art .wrapi{clip-path:inset(0 0 0 0);transform:none}
.slide.cur .art img,.slide.cur .art video{transform:none}
.slide.gone .art .wrapi{clip-path:inset(0 0 100% 0);transform:translateY(-10%)}
.slide .art video.px{image-rendering:pixelated;height:100%;width:auto;aspect-ratio:1}
.slide.cur{z-index:2}
.slide:not(.cur):not(.gone){visibility:hidden}
.ctl{position:fixed;z-index:40;left:clamp(18px,4vw,64px);right:clamp(18px,4vw,64px);bottom:26px;display:flex;align-items:center;gap:22px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.ctl .bar{flex:1;height:1px;background:rgba(27,25,23,.15);position:relative;overflow:hidden}
.ctl .bar i{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0)}
.ctl button{display:flex;align-items:center;gap:8px;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--ink)}
.ctl .arw{width:40px;height:40px;border:1px solid rgba(27,25,23,.25);border-radius:50%;justify-content:center;font-size:16px;letter-spacing:0}
.ctl .arw:hover{background:var(--ink);color:var(--paper)}
.hint{position:fixed;z-index:40;right:clamp(18px,4vw,64px);top:50%;transform:translateY(-50%) rotate(90deg);transform-origin:right center;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute)}
/* ===== transition ===== */
#wipe{display:none;position:fixed;inset:0;z-index:45;pointer-events:none;opacity:0}
#wipe.in{opacity:1;transition:opacity .42s cubic-bezier(.4,0,.2,1)}
#wipe.out{opacity:0;transition:opacity .65s ease}
#proj.in .pgrid{animation:rise .9s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.fly{position:fixed;z-index:47;object-fit:contain;pointer-events:none;transition:left 1s var(--ease),top 1s var(--ease),width 1s var(--ease),height 1s var(--ease),box-shadow 1s ease;box-shadow:0 40px 90px -30px rgba(40,30,20,.45)}
#proj{transition:opacity .55s ease}
#proj.leaving{opacity:0}
/* ===== project ===== */
#proj{position:relative;min-height:100vh;padding:96px clamp(18px,4vw,64px) 60px;display:none}
body.dark #proj{display:block}
.pgrid>*{min-width:0}
html,body{max-width:100%;overflow-x:hidden}
.pgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(24px,4.5vw,80px);align-items:start}
.stage{position:relative;height:calc(100vh - 150px);height:calc(100svh - 150px);min-height:360px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.stage .f{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;clip-path:inset(100% 0 0 0);transition:clip-path 1.1s var(--ease)}
.stage .f.on{clip-path:inset(0 0 0 0)}
.stage .f.off{clip-path:inset(0 0 100% 0)}
.stage .f img,.stage .f video{width:100%;height:100%;object-fit:contain;transform:scale(1.06);transition:transform 1.8s var(--out)}
.stage .f.on img,.stage .f.on video{transform:none}
.stage .f video.px{image-rendering:pixelated;height:100%;width:auto;aspect-ratio:1}
.sctl{display:flex;align-items:center;gap:18px;margin-top:16px;font-size:12px;letter-spacing:.18em;color:var(--nightMute)}
.sctl .arw{width:42px;height:42px;border:1px solid rgba(237,231,221,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--nightInk)}
.sctl .arw:hover{background:var(--nightInk);color:var(--night)}
.sctl .play{margin-left:auto;display:flex;gap:10px;align-items:center;padding:11px 18px;border:1px solid rgba(237,231,221,.35);border-radius:40px;color:var(--nightInk);letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.sctl .play:hover{background:var(--nightInk);color:var(--night)}
.strip{display:flex;gap:8px;margin-top:16px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;width:64px;height:80px;opacity:.38;transition:opacity .4s;position:relative}
.strip button.on,.strip button:hover{opacity:1}
.strip img{width:100%;height:100%;object-fit:cover}
.strip button.anim::after{content:'▶';position:absolute;left:5px;bottom:4px;font-size:10px;color:#fff;text-shadow:0 0 4px #000}
.ptxt{display:flex;flex-direction:column;gap:22px;padding-top:6px}
.ptxt .yr{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#E46A5E}
.ptxt h1{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(48px,6.4vw,112px);line-height:.98;letter-spacing:-.01em}
.ptxt .sub{font-family:var(--disp);font-size:24px;color:var(--nightMute)}
.ptxt .ln{margin:0;font-family:var(--disp);font-style:italic;font-size:clamp(20px,1.9vw,26px);line-height:1.45}
.ptxt .info p{margin:0 0 18px;font-size:16px;line-height:1.8;color:#CFC6B9;font-weight:300;letter-spacing:.01em}
.ptxt .tech{font-size:12px!important;letter-spacing:.16em;text-transform:uppercase;color:var(--nightMute)!important;border-top:1px solid rgba(237,231,221,.15);padding-top:16px;font-weight:400!important}
.ptxt .acts{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.ptxt .pill:hover{background:var(--nightInk);color:var(--night)}
.ptxt .note{font-size:13px;color:var(--nightMute)}
.close{position:fixed;z-index:55;top:16px;right:clamp(12px,3vw,40px);width:48px;height:48px;border-radius:50%;border:1px solid rgba(237,231,221,.35);display:none;align-items:center;justify-content:center;font-size:22px;color:var(--nightInk);background:rgba(14,13,12,.4);backdrop-filter:blur(6px)}
body.dark .close{display:flex}
body.dark header nav{display:none}
.nextp{display:block;margin-top:90px;padding-top:28px;border-top:1px solid rgba(237,231,221,.15)}
.nextp small{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--nightMute)}
.nextp b{display:block;font-family:var(--disp);font-weight:400;font-size:clamp(40px,6vw,96px);line-height:1.05;transition:transform .8s var(--out)}
.nextp:hover b{transform:translateX(18px)}
/* ===== index ===== */
#index{display:none;padding:120px clamp(18px,4vw,64px) 0}
body.idx #index{display:block}
body.idx #show,body.idx .ctl,body.idx .hint,body.dark #show,body.dark .ctl,body.dark .hint{display:none}
.ih{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;padding-bottom:28px;border-bottom:1px solid var(--ink)}
.ih h1{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(56px,9vw,150px);line-height:.9}
.ih p{margin:0;max-width:420px;font-size:15px;line-height:1.6;color:var(--soft)}
.irow{display:grid;grid-template-columns:44px 74px minmax(0,1.2fr) 70px minmax(0,1.6fr);gap:18px;align-items:center;padding:16px 0;border-bottom:1px solid rgba(27,25,23,.14);transition:padding .5s var(--out),background .5s}
.irow:hover{padding-left:14px;background:rgba(255,255,255,.5)}
.irow .n{font-size:12px;letter-spacing:.16em;color:var(--mute)}
.irow img{width:74px;height:92px;object-fit:cover}
.irow .t{font-family:var(--disp);font-size:clamp(24px,2.8vw,40px);line-height:1.05}
.irow .t span{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-family:var(--ui);margin-top:6px}
.irow .y{font-size:14px;color:var(--mute)}
.irow .l{font-size:15px;line-height:1.55;color:var(--soft)}
.reveal{opacity:0;transform:translateY(30px);transition:opacity .9s var(--out),transform 1s var(--out)}
.reveal.vis{opacity:1;transform:none}
.sec{padding-top:110px}
.sec h2{margin:0 0 26px;font-family:var(--disp);font-weight:400;font-size:clamp(40px,5vw,72px);line-height:1}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 70px 160px 70px;gap:16px;padding:15px 0;border-bottom:1px solid rgba(27,25,23,.14);align-items:baseline}
.erow .t{font-family:var(--disp);font-size:21px}
.erow span{font-size:14px;color:var(--mute)}
.erow .go{color:var(--red)}
.sec .lead{max-width:640px;font-size:15px;line-height:1.65;color:var(--soft);margin:0 0 24px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}
.box{border:1px solid rgba(27,25,23,.2);padding:28px;display:flex;flex-direction:column;gap:14px}
.box .k{margin:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--red)}
.box .nm{margin:0;font-family:var(--disp);font-size:28px}
.box p{margin:0;font-size:15px;line-height:1.6;color:var(--soft)}
.box .bs{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:40px}
.about .tx p{margin:0 0 18px;font-size:clamp(18px,1.7vw,22px);line-height:1.6;font-family:var(--disp)}
.about .tx p.s{font-family:var(--ui);font-size:15px;color:var(--mute)}
footer{margin-top:120px;padding:34px 0 40px;border-top:1px solid var(--ink);display:flex;flex-wrap:wrap;justify-content:space-between;gap:18px;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
footer .lk{display:flex;gap:26px;flex-wrap:wrap}
/* ===== lightbox / slideshow ===== */
#lb{position:fixed;inset:0;z-index:100;background:#080707;display:none}
#lb.open{display:block}
#lb .lbf{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px 28px 72px;opacity:0;transition:opacity 1s ease}
#lb .lbf.in{opacity:1}
#lb .lbf.out{opacity:0}
#lb .lbf img,#lb .lbf video{width:100%;height:100%;object-fit:contain}
#lb .lbf.in img{animation:kb 7s ease-out both}
@keyframes kb{from{transform:scale(1.04)}to{transform:none}}
#lb .lbf video.px{width:min(100%,calc(100vh - 100px));image-rendering:pixelated}
#lb .cap{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:18px;align-items:baseline;color:#A89E91;font-size:12px;letter-spacing:.18em;pointer-events:none}
#lb .cap b{font-family:var(--disp);font-weight:400;font-size:21px;letter-spacing:.02em;color:#F1EBE1}
#lb .b{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.1);color:#F1EBE1;font-size:26px;display:flex;align-items:center;justify-content:center}
#lb .x{top:16px;right:16px}#lb .p{left:16px;top:50%;margin-top:-26px}#lb .nx{right:16px;top:50%;margin-top:-26px}
#lb.auto .b{opacity:0;pointer-events:none}
/* ===== responsive ===== */
@media (max-width:900px),(orientation:portrait){
 .slide{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;padding:84px 20px 80px;gap:18px}
 .slide .art{order:1}
 .slide .meta{order:2;align-self:start;gap:10px}
 .slide .ln{display:none}
 .slide h2{font-size:clamp(40px,10vw,84px)}
 .hint{display:none}
 .pgrid{grid-template-columns:minmax(0,1fr)}
 .stage{position:relative;top:0;height:68vh;height:68svh}
 .sctl{flex-wrap:wrap;gap:12px}
 .ptxt h1{font-size:clamp(40px,11vw,72px)}
 .irow{grid-template-columns:34px 60px minmax(0,1fr) 50px}
 .irow .l{grid-column:3/5}
 .irow img{width:60px;height:76px}
 .about{grid-template-columns:1fr}
 .erow{grid-template-columns:minmax(0,1fr) 50px 70px}
 .erow .ed{display:none}
}
@media (orientation:landscape) and (max-height:560px){
 .slide{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-template-rows:none;padding:60px 20px 56px;gap:20px}
 .slide .art{order:2}.slide .meta{order:1;align-self:center;gap:8px}.slide h2{font-size:clamp(34px,6vw,56px)}.slide .ln{display:none}
 .pgrid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}.stage{height:calc(100vh - 120px);height:calc(100svh - 120px)}
 #proj{padding-top:64px}.ctl{bottom:12px}
}
@media (max-width:600px){nav{gap:12px;font-size:10.5px;letter-spacing:.1em}.sigimg{display:none}header{padding:14px 16px}#proj{padding:76px 16px 40px}.slide{padding:76px 16px 76px}.ctl{left:16px;right:16px;gap:12px}.irow{gap:10px}.ih h1{font-size:64px}.cards{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header><a class="logo" href="#" aria-label="Chista"><img class="sealimg" src="seal.png" alt=""><img class="sigimg" src="sig.png" alt="Chista"></a>

const DATA = [{"id": "bonjoy", "title": "BONJOY", "sub": "", "year": "2026", "line": "999 pixel skulls on Base. Dead, and doing fine.", "info": ["BONJOY is 999 pixel skulls by Chista, generated on Base. Each skull is decided at mint by a seed written on chain in the same transaction. Nobody, the artist included, knows which skull a mint will bring.", "Every piece is a six-second loop in which a skull might blink, burp, let its brain slide out of its eyes, or carry a sleeping cat."], "tech": "Pure JavaScript · no libraries", "imgs": ["img/bj1.jpg", "img/bj3.jpg", "img/bj12.jpg", "img/bj17.jpg", "img/bj6.jpg", "img/bj4.jpg", "img/bj5.jpg", "img/bj0.jpg", "img/bj2.jpg", "img/bj7.jpg", "img/bj8.jpg", "img/bj9.jpg", "img/bj10.jpg", "img/bj11.jpg", "img/bj13.jpg", "img/bj14.jpg", "img/bj15.jpg", "img/bj16.jpg", "img/bj18.jpg", "img/bj19.jpg", "img/bj20.jpg", "img/bj21.jpg", "img/bj23.jpg", "img/bj24.jpg", "img/bj25.jpg", "img/bj26.jpg"], "vids": ["img/bj1.mp4", "img/bj3.mp4", "img/bj12.mp4", "img/bj17.mp4", "img/bj6.mp4", "img/bj4.mp4", "img/bj5.mp4", "img/bj0.mp4", "img/bj2.mp4", "img/bj7.mp4", "img/bj8.mp4", "img/bj9.mp4", "img/bj10.mp4", "img/bj11.mp4", "img/bj13.mp4", "img/bj14.mp4", "img/bj15.mp4", "img/bj16.mp4", "img/bj18.mp4", "img/bj19.mp4", "img/bj20.mp4", "img/bj21.mp4", "img/bj23.mp4", "img/bj24.mp4", "img/bj25.mp4", "img/bj26.mp4"], "video": "", "released": true, "isNew": false, "ext": null, "tint": "#cde8e9"}, {"id": "zanzo", "title": "Zanzō", "sub": "残像", "year": "2026", "line": "Psychedelic mushrooms and melting skulls on ground that breathes like water, drawn line by line in riso inks.", "info": ["About a year and a half ago some friends of mine tried psychedelic mushrooms. I wanted to understand what they had been through, so I started reading: trip reports, the words people use for each stage of a trip, the science of psilocybin, and the Mazatec night ceremonies of María Sabina, who called the mushrooms niños santos, the holy children. While reading, the idea for this work came to me. I wrote its first base last year. This is the fuller version.", "Zanzō means afterimage: what the eye keeps after the light has gone. Every seed grows a real three-dimensional scene: a ground, the mushrooms, drawn from a library of psychoactive species, and human skulls lying among them. Then the whole scene is drawn by one hand. Nothing is painted. Every tone, shadow and colour on the sheet is a pen mark with a direction and a length, and one current runs through all of them: the lines that cross the ground climb over the caps, ring the stems and wrap the skulls.", "The ground behaves like water. Rings spread from every skull and every fairy ring, as if something had fallen into a still pond, and where they meet they bend each other, so everything in the field is connected underneath. A fairy ring is the edge of the mycelium growing outward through the soil, and here it is where the waves begin.", "The skulls are not decoration. Each one melts into the earth it lies on: its lower half sags, spreads and runs off with the current, and its ink turns, line by line, into the ink of the ground. Death becomes soil, soil feeds the mycelium, the mycelium fruits, and the mushrooms dream. Sometimes thin mushrooms grow out through an eye or a broken crown. Where a skull is wounded, blue veins spread over it, the way these mushrooms bruise blue when touched.", "The caps carry the marks of their species: zones, striate margins, fibres, scales and warts. Some mushrooms, and sometimes a whole cluster, turn into a rainbow of seven inks, in bands, ribs, a spiral up the stem, marbling or spots, following the shape of the mushroom.", "The scene can be laid out in many ways. Mushrooms gather in groves, fairy rings or dense rows; they climb a golden-angle spiral like the seeds of a sunflower, stand in concentric mandala rings, repeat in shrinking echoes like an afterimage, mirror one another across an axis, or scatter in small islands. Skulls gather into an ossuary, sit in a circle like a night ceremony, or swell into a hill covered in a forest of tiny mushrooms. Some editions leave open ground for living wood: an ancient trunk whose bark grain parts around knots and hollows, with shelf fungi spiralling up it and a skull set into a hollow, long thin mushrooms rising from its eyes; a fallen log showing its years at the cut end; a stump with a skull enthroned on it; great arching roots like a cathedral; a clearing among tall jointed reeds, some standing close in front of the eye; a meadow of tall grass where a few huge mushrooms lean out, sometimes drawn only in a few lines so the mushrooms carry the weight; white mycelium threads running across the ground between everything that grows; or a forest pool that holds the mushrooms and the old trunks upside down, in water that runs with the edition's rainbow.", "The margins are a notebook kept during the trip, in the work's own handwriting. Lines that people say during and after a trip are written, crossed out, rewritten or highlighted in riso ink. The Latin names of the species in the picture are noted beside it. Sometimes a timeline of the trip runs down one edge, with the moment this sheet belongs to, and the dose, marked in red.", "Some editions are rare. At night the paper turns dark, one kind of mushroom glows, spores drift like stars, and the camera drops low enough to see the horizon, where a starry sky in the spirit of Van Gogh swirls out of its stars, in the edition's own colours. Others hold a hidden word that is never written, only bent into the current, the four shapes that visionary eyes see everywhere (tunnel, spiral, lattice, cobweb) laid into the ground, a quiet distance where the far field fades into one ink, a light that falls on a single form, the afterimage of a skull floating beside it, or a ground ruled in perfectly straight lines, vertical, horizontal or diagonal, while the forms keep their own.", "The inks change with every edition. Most are pressed in one of twenty psychedelic ink sets, six or seven clashing colours each, chosen to fight one another rather than agree. Others are pressed in a single ink: only magenta, only cyan, only red, or light drawn out of black, white or gold. The sheet presses heavier towards the bottom, so where the top opens up the ground beneath it goes darker to hold it. Each edition shown here was given an ink set of its own, and the still editions are at 4K.", "Every piece can also draw itself on bare paper, the way a pen plotter works. First the pen traces an underdrawing, following each outline round its form as one closed line. Then the inks come one at a time. Each is hatched row by row, back and forth, a swath of rows here and then another swath somewhere else on the sheet, the mark under the pen only half finished. Long strokes grow out from where they start and the threads run out along their length, until the sheet is whole. Nothing is uncovered or wiped in. Every mark is drawn."], "tech": "JavaScript · WebGL2 · custom 3D hatching engine", "imgs": ["img/zanzo-p1.jpg", "img/zanzo-t1.jpg", "img/yumetake-s1.jpg", "img/zanzo-p2.jpg", "img/zanzo-t2.jpg", "img/yumetake-s2.jpg", "img/zanzo-p3.jpg", "img/zanzo-t3.jpg", "img/yumetake-s3.jpg", "img/zanzo-p4.jpg", "img/zanzo-t4.jpg", "img/yumetake-s4.jpg", "img/zanzo-p5.jpg", "img/zanzo-t5.jpg", "img/yumetake-s5.jpg", "img/zanzo-p6.jpg", "img/zanzo-t6.jpg", "img/yumetake-s6.jpg", "img/zanzo-p7.jpg", "img/zanzo-t7.jpg", "img/zanzo-s7.jpg", "img/zanzo-p8.jpg", "img/zanzo-t8.jpg", "img/zanzo-s8.jpg", "img/zanzo-s10.jpg", "img/zanzo-s11.jpg", "img/zanzo-s12.jpg"], "vids": ["img/zanzo-p1.mp4", "", "", "img/zanzo-p2.mp4", "", "", "img/zanzo-p3.mp4", "", "", "img/zanzo-p4.mp4", "", "", "img/zanzo-p5.mp4", "", "", "img/zanzo-p6.mp4", "", "", "img/zanzo-p7.mp4", "", "", "img/zanzo-p8.mp4", "", "", "", "", ""], "video": "", "released": false, "isNew": true, "ext": null, "tint": "#d6d2ee", "posters": ["img/zanzo-p1-0.jpg", "", "", "img/zanzo-p2-0.jpg", "", "", "img/zanzo-p3-0.jpg", "", "", "img/zanzo-p4-0.jpg", "", "", "img/zanzo-p5-0.jpg", "", "", "img/zanzo-p6-0.jpg", "", "", "img/zanzo-p7-0.jpg", "", "", "img/zanzo-p8-0.jpg", "", "", "", "", ""]}, {"id": "allaprima", "title": "Alla Prima", "sub": "", "year": "2026", "line": "Checkered cloth over hidden volumes, painted in oil, layer by layer. Every seed is a finished canvas.", "info": ["Each work begins as a three-dimensional scene: checkered cloth draped over hidden forms, then shifted, pulled and cut apart until only the painting is left.", "The oil engine was written specially for this work. It paints the way oil painters did, session by session, from a thin underpainting to glazes, thick lights and varnish. The brush runs dry, drags wet paint and moves shape by shape across the canvas, like a painter's hand."], "tech": "JavaScript · WebGL2 · custom engine built for painting · no libraries", "imgs": ["img/ap-r1588p.jpg", "img/ap-r7777p.jpg", "img/ap-r42p.jpg", "img/ap-r3317p.jpg", "img/ap-r31415p.jpg", "img/ap-r50505p.jpg", "img/ap-r31415.jpg", "img/ap-r3317.jpg", "img/ap-r6262.jpg", "img/ap-r1234p.jpg", "img/ap-r11111p.jpg", "img/ap-r4096p.jpg", "img/ap-r311p.jpg", "img/ap-r7.jpg", "img/ap-r2401p.jpg", "img/ap-r905p.jpg"], "vids": ["img/ap-r1588p.mp4", "img/ap-r7777p.mp4", "img/ap-r42p.mp4", "img/ap-r3317p.mp4", "img/ap-r31415p.mp4", "img/ap-r50505p.mp4", "img/ap-r31415.mp4", "img/ap-r3317.mp4", "img/ap-r6262.mp4", "img/ap-r1234p.mp4", "img/ap-r11111p.mp4", "img/ap-r4096p.mp4", "img/ap-r311p.mp4", "img/ap-r7.mp4", "img/ap-r2401p.mp4", "img/ap-r905p.mp4"], "video": "", "released": false, "isNew": true, "ext": null, "tint": "#eedec7"}, {"id": "divoni", "title": "Divoni", "sub": "ディヴォニ", "year": "2026", "line": "Legendary Japanese warriors built from my own drawings, painted in watercolour on aged washi.", "info": ["In Japanese painting the oni, demons, ogres and fierce guardians, have been drawn for centuries, and almost every culture in the world has painted its own: the div, the demon, the monster at the edge of the map. Divoni brings these figures together in one face. Its name joins div and oni, and it gives that old image a new form: a generative portrait, born on the blockchain.", "Divoni is built from more than a hundred of my hand drawings. Forty-eight full warrior designs are cut into seven parts, crest, halo, second halo, face, eyes, beard and armour, and every part can come from any design, from its left or its right half. The code chooses, mirrors, scales and joins them, so the number of possible warriors runs into the trillions. None of them existed before, but every line in them was drawn by hand.", "Everything is fully generative and fully code: the drawing, the colour, the watercolour and the paper. The watercolour engine was written specially for this work. Pigment flows where the paper is wet, gathers at the drying edge and blooms, but stops at the eyes so the gaze stays sharp. Each sheet is mounted on aged Japanese paper."], "tech": "Pure JavaScript · WebGL2 · custom watercolour engine · no libraries", "imgs": ["img/divoni-0.jpg", "img/divoni-n1.jpg", "img/divoni-n7.jpg", "img/divoni-n6.jpg", "img/divoni-n3.jpg", "img/divoni-n4.jpg", "img/divoni-n5.jpg", "img/divoni-3.jpg", "img/divoni-2.jpg", "img/divoni-n2.jpg", "img/divoni-n8.jpg", "img/divoni-1.jpg", "img/divoni-n10.jpg", "img/divoni-4.jpg", "img/divoni-n11.jpg", "img/divoni-5.jpg"], "vids": ["", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null, "tint": "#c7eedb"}, {"id": "cubist", "title": "Cube Girls", "sub": "", "year": "2026", "line": "One seed, one woman: cubist portraits grown from a decision tree and painted in wet-on-wet pastel.", "info": ["The seated woman is one of the great subjects of Cubism. Cube Girls returns to her in my own handwriting, with rules drawn from my cubist pastel works. Every work holds one woman, close up, at the shoulders, half-length, seated, in profile, seen from above or rising from below, and she dissolves into the same broken geometry as the room around her.", "She is not assembled the way a profile picture is, by stacking layers. A decision tree builds her, choice by choice: the framing decides the pose, the pose decides the hands, the look decides the sleeves, the dress decides what may sit around the neck. Face, eyes, brows, nose, mouth, hair, hat, collar, jewellery, flowers, the room and the art on its wall, more than thirty traits in all, each depending on the ones before it. One half of a face may come from one type and the other half from another. That is why no two works are alike: they differ in kind, not only in colour.", "Rare branches of the tree lead further: women drawn after African masks, gowns and grounds of Klimt gold, hands that make a heart, cubist smiles, pure line drawings and black ink cuts across every plane. Every ground, plain or full of objects, is built as a finished cubist painting in its own right.", "The pastel engine was written specially for this work, and it paints as a pastel artist does. Colour is laid wet on wet, so neighbouring planes bleed softly into each other; pencil hatching runs over the colour in layers; the pigment catches on the fibres of the paper like felt, and the frame takes its colour from each palette. Form comes from colour, never from outline."], "tech": "Pure JavaScript · Canvas & WebGL · custom wet-on-wet pastel engine · no libraries", "imgs": ["img/cube-c0.jpg", "img/cube-c1.jpg", "img/cube-c2.jpg", "img/cube-c3.jpg", "img/cube-c4.jpg", "img/cube-c5.jpg", "img/cubist-n8.jpg", "img/cubist-6.jpg", "img/cubist-2.jpg", "img/cube-c6.jpg", "img/cube-c7.jpg", "img/cube-c8.jpg", "img/cube-c9.jpg", "img/cube-c10.jpg", "img/cube-c11.jpg", "img/cubist-n0.jpg", "img/cubist-4.jpg", "img/cubist-n2.jpg", "img/cubist-7.jpg", "img/cubist-n3.jpg"], "vids": ["", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null, "tint": "#c7eee7"}, {"id": "cubegirls", "title": "Cube Girls: Études", "sub": "", "year": "2026", "line": "The same women before the paint: the artist's working sheet, with the first underdrawing, the decisions, the notes and the small studies still on it.", "info": ["Every artist keeps notebooks. Before a portrait is painted, it lives there first: a first sketch, a few decisions, a study, notes in the margin. Cube Girls: Études comes from those notebooks. It is the second face of Cube Girls, with the same decision tree, the same women and the same cubist cuts, shown at the moment before painting, as a page from the artist's book.", "Under the ink lies the first underdrawing of the woman, in a shaky pencil line, taken from the figure before its cubist cuts, so the straight cut lines still show beneath the shifted ink. Some of the early lines survive; others have been rubbed out, because the decision changed once the work was carried out. Where there is room, a small study of part of the work sits beside it, drawn again at a smaller size.", "Around her are the artist's notes, written, struck through, erased and written again, and they are deliberately hard to read. In my own notebooks the notes I write about a drawing are always like this; sometimes even I cannot read them, or understand in that moment what I meant. Slowly the way becomes clear, and the work is finished. These pages keep that moment, before it is clear.", "The sheet is an old one, and it has lived: folds, creases, foxing, tape, worn corners and the grain of the paper. The ink and pencil engine was written specially for this work."], "tech": "Pure JavaScript · Canvas · custom ink, pencil and paper engine · no libraries", "imgs": ["img/cubegirls-1.jpg", "img/cubegirls-n1.jpg", "img/cubegirls-n9.jpg", "img/cubegirls-n10.jpg", "img/cubegirls-n5.jpg", "img/cubegirls-2.jpg", "img/cubegirls-n6.jpg", "img/cubegirls-n4.jpg", "img/cubegirls-4.jpg", "img/cubegirls-n7.jpg", "img/cubegirls-n2.jpg", "img/cubegirls-n11.jpg", "img/cubegirls-n3.jpg", "img/cubegirls-3.jpg", "img/cubegirls-n8.jpg", "img/cubegirls-5.jpg"], "vids": ["", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null, "tint": "#e4dfd2"}, {"id": "boro", "title": "Boro", "sub": "ぼろ 2026", "year": "2026", "line": "Generative embroidery: scraps of cloth gathered and stitched, and the cloth can be turned over to see its back.", "info": ["Nothing in boro is thrown away. A torn sleeve, an old kimono, a scrap of indigo: each one is given a new life inside another cloth, and keeps working. The word comes from the Japanese boroboro, something tattered or mended. Every piece in this series is made the same way, from fragments that carry a past, joined into something that has never existed before.", "Boro is the Japanese tradition of mending worn cloth, patch over patch, until the repairs become the beauty of the fabric. Each work gathers patches of linen, kasuri and printed fabrics and joins them with running stitches, and you watch the piece being sewn, stitch by stitch.", "The Back view turns the textile over to show the reverse of the stitching, and the Light view holds it up against the light. Rare pieces leave the patchwork behind: a koi pond where one great fish is pieced from scraps, kintsugi gold, aizome indigo, imperial blue and gin silver."], "tech": "Pure JavaScript · Canvas 2D & WebGL · custom thread and fibre engine · no libraries", "imgs": ["img/boro-f0.jpg", "img/boro-a1.jpg", "img/boro-f1.jpg", "img/boro-a2.jpg", "img/boro-f2.jpg", "img/boro-f3.jpg", "img/boro-f4.jpg", "img/boro-f5.jpg", "img/boro-f6.jpg", "img/boro-f7.jpg", "img/boro-g0.jpg", "img/boro-g3.jpg", "img/boro-g2.jpg", "img/boro-g5.jpg", "img/boro-g1.jpg", "img/boro-g4.jpg"], "vids": ["", "img/boro-a1.mp4", "", "img/boro-a2.mp4", "", "", "", "", "", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null, "tint": "#cfe7dd"}, {"id": "cells", "title": "Tsugihagi", "sub": "継ぎ接ぎ", "year": "2026", "line": "A patchwork of worlds: scraps of cloth, cells and pattern pieced together and sewn into one textile.", "info": ["Tsugihagi is the Japanese word for patchwork, cloth pieced together from many scraps. Almost every culture has made it: the chehel tekeh of Persia, the kantha and ralli of India, the bojagi of Korea, the kurak of Central Asia, the quilts of America. Laid on a table, spread on a bed or hung on a wall, these cloths gather what was left over and give it a new order. Each one is different, yet they all share the same patience and the same joy in colour.", "Tsugihagi is sewn, not painted. Like my Boro, every piece is cut, laid down and stitched to its neighbours, and the seams stay visible. But here the patchwork gathers several worlds at once: fields where cells drift and gather, shifted blocks like a glitching quilt, ornate tapestry bands, and pieces like little maps on graph paper. Small bodies live inside them, beans, pairs, cells with nuclei, and threads cross the seams as if holding hands. Some cloths are finished with a brocade border, ready to hang on a wall.", "The palettes were measured from my reference works, and the textile engine was written specially for this work: the weave of each fabric, the running stitches along every seam, the slight lift where one piece overlaps another."], "tech": "Pure JavaScript · WebGL2 · custom textile and stitch engine · no libraries", "imgs": ["img/tsugi-1.jpg", "img/tsugi-3.jpg", "img/tsugi-0.jpg", "img/tsugi-5.jpg", "img/tsugi-6.jpg", "img/tsugi-2.jpg", "img/tsugi-7.jpg", "img/tsugi-8.jpg", "img/tsugi-10.jpg", "img/tsugi-4.jpg", "img/tsugi-9.jpg"], "vids": ["", "", "", "", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null, "tint": "#ece6dc"}, {"id": "simorgh", "title": "Simorgh", "sub": "", "year": "2026", "line": "Abstract paintings of the mythical bird: ribbons, feathers and eyes inside the pages of an old Persian book.", "info": ["In Attar's Conference of the Birds, thousands of birds set out to find the Simorgh, their king. Only thirty reach the end, and there they find that the Simorgh is themselves: si morgh, thirty birds. In this series she is never shown whole. She appears as a wing, a head, a flower or a tree, each work one glimpse of her.", "Simorgh is a modern painting that borrows from the old Persian art of the book. The trees are the trees of Persian miniatures. The frames are the page layouts of old Persian manuscripts, with their gold leaf and fields of stippled dots. And the bird has a logic of her own: wherever a wing reaches, the frame bends and breaks around it.", "She is built from long painted ribbons, teardrop eyes and feather patterns, following the golden spiral. Most works are in natural colour; rare ones turn psychedelic, or negative, the whole painting in a single tinted tone."], "tech": "Pure JavaScript · Canvas · custom painting engine · no libraries", "imgs": ["img/simorgh-n1.jpg", "img/simorgh-n101.jpg", "img/simorgh-n105.jpg", "img/simorgh-1.jpg", "img/simorgh-n2.jpg", "img/simorgh-n103.jpg", "img/simorgh-n3.jpg", "img/simorgh-n106.jpg", "img/simorgh-n8.jpg", "img/simorgh-n100.jpg", "img/simorgh-n0.jpg", "img/simorgh-n7.jpg", "img/simorgh-n112.jpg", "img/simorgh-2.jpg", "img/simorgh-3.jpg", "img/simorgh-4.jpg", "img/simorgh-5.jpg"], "vids": ["", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null, "tint": "#eedbc7"}, {"id": "niwa", "title": "Niwa", "sub": "庭", "year": "2026", "line": "A Japanese garden built layer by layer, from the grass at your feet to the mountain on the horizon.", "info": ["A Japanese garden is made to be walked through slowly. It hides as much as it shows, and every turn of the path opens a new view. Niwa is built the same way, in layers, from near to far.", "It begins with meadow grass and flowers. Then a pond, with koi moving in it. Further on, bonsai and pines, and a bridge over the water. Sometimes women in kimono walk in the garden. Japanese houses rise against the sky, trees show behind the fences, and far away there is a mountain, sometimes with the sun above it. The garden keeps going, as far as the eye can see, a world with room left to discover.", "Every seed chooses where to stand and how to look: at the koi pond, in a bamboo grove, among the reeds, before a temple or under a sakura bough. Everything is drawn in one even line. Stones are cut into faceted planes and hatched, seasons bring rain, snow, petals and passing birds, and the same drawing can be printed in sumi black, black and gold, navy, dark green, watercolour or risograph."], "tech": "Pure JavaScript · custom vector line engine · no libraries", "imgs": ["img/niwa-q0.jpg", "img/niwa-q1.jpg", "img/niwa-q2.jpg", "img/niwa-q3.jpg", "img/niwa-q4.jpg", "img/niwa-q5.jpg", "img/niwa-q6.jpg", "img/niwa-q7.jpg", "img/niwa-q8.jpg", "img/niwa-q9.jpg", "img/niwa-q10.jpg", "img/niwa-q11.jpg", "img/niwa-q12.jpg", "img/niwa-q13.jpg", "img/niwa-q14.jpg", "img/niwa-q15.jpg"], "vids": ["", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null, "tint": "#e7dfcf"}, {"id": "gunta", "title": "Gunta Rug", "sub": "Square", "year": "2026", "line": "Square deep-pile rugs, woven in yarn and rendered knot by knot.", "info": ["Gunta is named after Gunta Stölzl, master of the Bauhaus weaving workshop, and it sits between two traditions: the geometric rugs of the Bauhaus and the free, hand-knotted gabbeh of the Persian nomads. The grid gives the order, the hand gives the life: rows swell, thin and drift, and colours shift from knot to knot.", "Each rug has a border, an inner frame of small forms, and a field that follows one of two grammars: stepped bands of colour, or a mirrored check of wide fields and narrow strips. Colour comes from forty yarn palettes.", "Th 2026", "line": "An underwater garden of creatures born from a genome, in watercolour and the colours of late Kandinsky.", "info": ["Deep Garden is not a collage. Nothing here is a head taken from one drawing and a tail from another. It has a genome. I made 255 drawings of sea creatures, measured every one of them, and reduced all their differences to 28 genes. From those genes the work grows creatures of its own, and not one of them looks like any of the 255. The drawings gave their genome; the creatures are born from it.", "Because they are born, they inherit. Parents pass their genes to their young, and sometimes a whole family appears, mother, father and children swimming together, alike in the way relatives are alike. Even the patterns inside their bodies, cells, spots, stripes and eyes, come down through the same genes. Sunken ships have a genome of their own, taken from ten of my wreck drawings.", "About fifty scenes, a shoal, a reef, a whirlpool, a cave, a kelp forest, decide how the garden grows. The watercolour engine was written specially for this work, painting in four layers with paper relief, flowing water and wet edges."], "tech": "Pure JavaScript · Canvas 2D & WebGL2 · custom genome and watercolour engine · no libraries", "imgs": ["img/deepgarden-f1.jpg", "img/deepgarden-f2.jpg", "img/deepgarden-f3.jpg", "img/deepgarden-f4.jpg", "img/deepgarden-2.jpg", "img/deepgarden-n0.jpg", "img/deepgarden-4.jpg", "img/deepgarden-n1.jpg", "img/deepgarden-1.jpg", "img/deepgarden-n6.jpg", "img/deepgarden-n11.jpg", "img/deepgarden-3.jpg", "img/deepgarden-n4.jpg", "img/deepgarden-n2.jpg", "img/deepgarden-5.jpg", "img/deepgarden-n10.jpg", "img/deepgarden-n8.jpg", "img/deepgarden-n9.jpg"], "vids": ["", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null, "tint": "#eae5cc"}, {"id": "polaroid", "title": "Polaroid Long Exposure", "sub": "", "year": "2026", "line": "Night roads outside real cities, seen by a photographer who is moving too: the horizon holds still while lamps and headlights stretch and wave.", "info": ["A Polaroid is a memory you can hold. This series begins with an earlier work of mine, a night drive photographed from inside a moving bus, and rebuilds it as a real three-dimensional world. Each picture is a true long exposure: the bus, the cars and my hand all move while the shutter is open, and the tremor of the hand is written into the lights.", "Every print is a memory of a journey to a real place. The work is built on geography: each picture belongs to a city, from Paris and Kyoto to Phoenix and Cape Town, and carries its name, its code and a date beneath the image, like notes written on the back of a travel photo. The whole landscape follows that place: the trees are species that grow there, the mountains, deserts, forests and plains are shaped like its land, the sky and the weather are its own, and the road signs follow its country's system.", "A film engine written specially for this work develops the picture, with the failures of real old Polaroids: burst chemistry, streaks, stains and fading. You can watch each print develop, slowly coming up out of the dark."], "tech": "Pure JavaScript · WebGL · custom exposure and film engine · no libraries", "imgs": ["img/polaroid-g0.jpg", "img/polaroid-g1.jpg", "img/polaroid-g2.jpg", "img/polaroid-g3.jpg", "img/polaroid-g4.jpg", "img/polaroid-g5.jpg", "img/polaroid-g6.jpg", "img/polaroid-g7.jpg", "img/polaroid-g8.jpg", "img/polaroid-g9.jpg", "img/polaroid-g10.jpg", "img/polaroid-g11.jpg", "img/polaroid-a1.jpg", "img/polaroid-a3.jpg", "img/polaroid-a4.jpg"], "vids": ["img/polaroid-g0.mp4", "img/polaroid-g1.mp4", "img/polaroid-g2.mp4", "img/polaroid-g3.mp4", "img/polaroid-g4.mp4", "img/polaroid-g5.mp4", "img/polaroid-g6.mp4", "img/polaroid-g7.mp4", "img/polaroid-g8.mp4", "img/polaroid-g9.mp4", "img/polaroid-g10.mp4", "img/polaroid-g11.mp4", "img/polaroid-a1.mp4", "img/polaroid-a3.mp4", "img/polaroid-   s.innerHTML = `<div class="meta"><span class="num rise">${pad(i + 1)} — ${pad(DATA.length)}${d.released ? ' · <b style="color:var(--red);font-weight:500">Minting now</b>' : d.isNew ? ' · New' : ''}</span>
<h2>${words(d.title)}</h2>${d.sub ? `<span class="sub rise">${esc(d.sub)}</span>` : ''}<p class="ln rise">${esc(d.line)}</p>
<div class="acts rise"><a class="pill" href="#p/${d.id}">Discover →</a>${d.released ? `<a class="pill red" href="${L.mint}">Mint</a>` : ''}</div></div>
<div class="art"><div class="wrapi">${first}</div></div>`;
  s.querySelector('.art').onclick = () => { markFly(s.querySelector('.art img, .art video')); location.hash = 'p/' + d.id; };
  s.querySelector('.acts a').addEventListener('click', () => markFly(s.querySelector('.art img, .art video')));

const slides = [...show.querySelectorAll('.slide')];
function goSlide(n, instant) {
  n = (n + slides.length) % slides.length;
  const old = slides[si];
  if (old && n !== si) { old.classList.remove('cur', 'in'); old.classList.add('gone'); const ov = old.querySelector('video'); setTimeout(() => { old.classList.remove('gone'); if (ov) ov.pause(); }, 1300); }
  si = n; const s = slides[si];
  s.classList.remove('gone');
  requestAnimationFrame(() => { s.classList.add('cur'); setTimeout(() => s.classList.add('in'), instant ? 0 : 350); });
  playVid(s.querySelector('video'));
  $('#bg').style.background = `radial-gradient(120% 90% at 75% 45%, ${DATA[si].tint} 0%, #F5F2EC 70%)`;
  $('#cnt').textContent = pad(si + 1) + ' / ' + pad(slides.length);

}
function runBar() {
  clearTimeout(sT); const b = $('#bar');
  if (barAnim) barAnim.cancel();
  if (paused || introOn || !document.body.classList.contains('sh')) { b.style.transform = 'scaleX(0)'; return; }
  const d = DATA[si].id === 'bonjoy' ? 9000 : 7000;
  barAnim = b.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: d, easing: 'linear', fill: 'forwards' });
  sT = setTimeout(() => goSlide(si + 1), d);
}
function step(d) { if (sBusy) return; sBusy = true; setTimeout(() => sBusy = false, 1100); goSlide(si + d); }
$('#prev').onclick = () => step(-1); $('#next').onclick = () => step(1);
$('#pause').onclick = () => { paused = !paused; $('#pause').textContent = paused ? 'Play' : 'Pause'; runBar(); };
show.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > 18) step(e.deltaY > 0 ? 1 : -1); }, { passive: true });
let tsx = null, tsy = null;
show.addEventListener('touchstart', e => { tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; }, { passive: true });
show.addEventListener('touchend', e => { if (tsx === null) return; const dx = e.changedTouches[0].clientX - tsx, dy = e.changedTouches[0].clientY - tsy; tsx = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 45) step((Math.abs(dy) > Math.abs(dx) ? dy : dx) < 0 ? 1 : -1); });
document.addEventListener('keydown', e => { if ($('#lb').classList.contains('open') || !document.body.classList.contains('sh')) return;
  if (['ArrowDown', 'ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); step(1); }
  if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); step(-1); }
  if (e.key === 'Enter') location.hash = 'p/' + DATA[si].id; });

/* ===================== FLY ===================== */
let flyFrom = null;
function markFly(el) { if (!el) return; const r = el.getBoundingClientRect(); if (r.width < 4) return;
  flyFrom = { src: el.tagName === 'VIDEO' ? (el.poster || '') : el.currentSrc || el.src, r, cover: el.closest('.irow') ? 1 : 0 }; }
function fitRect(box, w, h) { const k = Math.min(box.width / w, box.height / h); const tw = w * k, th = h * k; return { left: box.left + (box.width - tw) / 2, top: box.top + (box.height - th) / 2, width: tw, height: th }; }
/* ===================== PROJECT ===================== */
let cur = null;
function renderProject(p) {
  const i = DATA.indexOf(p), nx = DATA[(i + 1) % DATA.length];
  const items = p.imgs.map((s, n) => n); if (p.video) items.push('video');

  proj.innerHTML = `<div class="pgrid"><div><div class="stage" id="stage"></div>
<div class="sctl"><button class="arw" id="sp" aria-label="Previous output">←</button><button class="arw" id="sn" aria-label="Next output">→</button><span id="scnt"></span><button class="play" id="playall">▶ Slideshow</button></div>
<div class="strip">${items.map(n => n === 'video' ? `<button data-n="video" class="anim"><img src="${p.imgs[0]}" alt=""></button>` : `<button data-n="${n}" ${p.vids[n] && p.id !== 'bonjoy' ? 'class="anim"' : ''}><img loading="lazy" src="${p.imgs[n]}" alt=""></button>`).join('')}</div></div>
<div class="ptxt"><span class="yr rise">${p.released ? p.year + ' · Released · minting now' : 'Unreleased · still in the studio'}</span>
<h1>${words(p.title)}</h1>${p.sub ? `<span class="sub rise">${esc(p.sub)}</span>` : ''}
<p class="ln rise">${esc(p.line)}</p>
${p.released ? `<div class="acts rise"><a class="pill red" href="${L.mint}">Mint on OpenSea</a><a class="pill" href="${L.opensea}">Secondary market</a></div>` : ''}
${p.ext ? `<div class="acts rise"><a class="pill" href="${p.ext.url}">${esc(p.ext.label)} →</a><span class="note">${esc(p.ext.note)}</span></div>` : ''}
<div class="info">${p.info.map((t, k) => `<p class="rise" style="transition-delay:${.35 + k * .12}s">${esc(t)}</p>`).join('')}${p.tech ? `<p class="tech rise" style="transition-delay:${.4 + p.info.length * .12}s">${esc(p.tech)}</p>` : ''}</div>
<a class="nextp rise" href="#p/${nx.id}"><small>Next work</small><b>${esc(nx.title)} →</b></a></div></div>`;

}
function showOut(n, first) {

  playVid(f.querySelector('video'));
  $('#scnt').textContent = pad(cur.items.indexOf(n) + 1) + ' / ' + pad(cur.items.length);

}
function stepOut(d) { const k = cur.items.indexOf(cur.n); showOut(cur.items[(k + d + cur.items.length) % cur.items.length]); }
$('#close').onclick = () => { location.hash = ''; };

/* ===================== LIGHTBOX / SLIDESHOW ===================== */
const lb = $('#lb'); let lbAuto = false, lbT = null;
function lbRender() {

<div class="sec" id="earlier"><h2 class="reveal">Earlier works</h2><p class="lead reveal">Sixteen generative collections released on Tezos, 2022–2023, all sold out. Each one lives on its seeded.art page with its own notes.</p>
${EARLIER.map(e => `<a class="erow reveal" href="${e.url}"><span class="t">${esc(e.title)}</span><span>${e.year}</span><span class="ed">${esc(e.ed)}</span><span class="go">View →</span></a>`).join('')}</div>
<div class="sec" id="collect"><h2 class="reveal">Collect</h2><div class="cards">
<div class="box reveal"><p class="k">Minting now · Base</p><p class="nm">BONJOY</p><p>Mint a skull, or buy and sell skulls already minted, on OpenSea.</p><div class="bs"><a class="pill red" href="${L.mint}">Mint</a><a class="pill" href="${L.opensea}">Secondary market</a></div></div>
<div class="box reveal"><p class="k">Secondary · Tezos</p><p class="nm">Earlier collections</p><p>All sixteen collections are sold out; works are collected from their holders on objkt, and every work can be reached from its seeded.art page.</p><div class="bs"><a class="pill" href="${L.objkt}">objkt</a><a class="pill" href="${L.seed}">seeded.art</a></div></div>
<div class="box reveal"><p class="k" style="color:var(--mute)">Not yet released</p><p class="nm">New series</p><p>The other series on this site have not been released yet. Follow on X to hear first when the next one opens.</p><div class="bs"><a class="pill" href="${L.x}">@chistaai</a></div></div>
</div></div>
<div class="sec about" id="about"><h2 class="reveal">About</h2><div class="tx">

<p class="s reveal">Previous releases: sixteen collections on Tezos (2022–2023), Verse, Highlight. BONJOY on Base, 2026.</p></div></div>
<footer><span>© 2026 Chista</span><span class="lk"><a href="${L.x}">X</a><a href="${L.opensea}">OpenSea</a><a href="${L.objkt}">objkt</a><a href="${L.seed}">seeded.art</a></span></footer>`;

/* ===================== INK BLOOM ===================== */
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function tween(dur, fn, done, e = ease) { const t0 = performance.now(); const f = now => { const k = Math.min(1, (now - t0) / dur); fn(e(k)); if (k < 1) requestAnimationFrame(f); else if (done) done(); }; requestAnimationFrame(f); }
function wipeBloom(x, y, color, dur, done) { const w = $('#wipe'); w.style.background = color; w.style.display = 'block'; w.className = ''; void w.offsetWidth; w.className = 'in'; setTimeout(() => done && done(), 420); }
function wipeOff() { const w = $('#wipe'); w.className = 'out'; setTimeout(() => { w.style.display = 'none'; w.className = ''; }, 700); }

/* ===================== INTRO ===================== */
let introOn = false;
function intro() {

  const pool = VIVID.slice();

  $('#ink').innerHTML = pool.slice(0, 4).map(x => `<img src="${x}" alt="">`).join('');
  const leave = () => { if (!introOn) return; introOn = false; try { sessionStorage.setItem('ci', '1'); } catch (e) {}
    el.classList.add('out'); el.style.pointerEvents = 'none';
    const sw = $('#sw'), t = document.querySelector('.sigimg'), a = sw.getBoundingClientRect(), b = t ? t.getBoundingClientRect() : { left: 20, top: 20, height: 30 };

document.querySelector('.logo').addEventListener('click', e => { e.preventDefault();

/* ===================== ROUTER ===================== */
let mode = null;
function route() {

  if (h.startsWith('p/') && byId(h.slice(2))) {
    const p = byId(h.slice(2));

    const entering = mode !== 'proj';

    let fly = null;

          const t = fitRect(st.getBoundingClientRect(), w, h);
          Object.assign(fly.style, { left: t.left + 'px', top: t.top + 'px', width: t.width + 'px', height: t.height + 'px', boxShadow: '0 0 0 rgba(0,0,0,0)' });

  }
}
window.addEventListener('hashchange', route);
intro();
route();
