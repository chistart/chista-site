<style>
:root{--bg:#F4EFE6;--ink:#2A2622;--mute:#7A6F63;--soft:#4A433C;--line:#DCD3C5;--card:#EAE2D4;--red:#A8322A}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img,video{display:block}
.serif{font-family:'Shippori Mincho',serif}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
header .wrap{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;padding-top:24px;padding-bottom:24px}
.logo{display:flex;align-items:center;gap:12px}
.seal{width:34px;height:34px;background:var(--red);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'Shippori Mincho',serif;font-size:13px;line-height:1.05;text-align:center;border-radius:3px}
.logo b{font-family:'Shippori Mincho',serif;font-weight:400;font-size:24px;letter-spacing:.04em}
nav{display:flex;flex-wrap:wrap;gap:26px;font-size:15px}
nav a{padding:8px 0}
nav a.mint{color:var(--red);font-weight:600}
.btn{display:inline-block;padding:14px 26px;font-size:15px;font-weight:500;border-radius:2px;border:1px solid var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.eyebrow{margin:0;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
h1,h2{font-family:'Shippori Mincho',serif;font-weight:400;margin:0}
.hero{display:flex;flex-wrap:wrap;gap:56px;align-items:center;padding-top:24px;padding-bottom:80px}
.hero .txt{flex:1 1 400px;min-width:0;display:flex;flex-direction:column;gap:26px}
.hero h1{font-size:clamp(38px,5vw,58px);line-height:1.1}
.hero p.lead{margin:0;font-size:18px;line-height:1.65;color:var(--soft);max-width:520px}
.hero figure{flex:1 1 440px;min-width:0;margin:0;display:flex;flex-direction:column;gap:12px}
.hero figure img{width:100%;height:auto;box-shadow:0 24px 60px rgba(42,38,34,.18)}
.hero figcaption{font-size:13px;color:var(--mute)}
.mintband{background:var(--ink);color:var(--bg)}
.mintband .wrap{display:flex;flex-wrap:wrap;gap:52px;align-items:center;padding-top:72px;padding-bottom:72px}
.mintband .vid{flex:0 1 380px;min-width:0;background:#1E1B18;padding:18px}
.mintband video{width:100%;image-rendering:pixelated}
.mintband .txt{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:20px}
.mintband h2{font-size:52px}
.mintband p{margin:0;font-size:18px;line-height:1.65;color:#D8CFC2}
.mintband .eyebrow{color:#D9A79F}
.mintband .btn{border-color:var(--bg)}
.mintband .btn.light{background:var(--bg);color:var(--ink);font-weight:600}
section.block{padding-top:72px;padding-bottom:40px;display:flex;flex-direction:column;gap:28px}
section.block h2{font-size:42px}
.head{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:baseline;justify-content:space-between}
.head p{margin:0;font-size:14px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:44px 28px}
.card{display:flex;flex-direction:column;gap:14px;cursor:pointer}
.card .frame{aspect-ratio:4/5;background:var(--card);display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
.card .frame img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .5s ease}
.card:hover .frame img{transform:scale(1.02)}
.card .badge{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.card .t{margin:0;font-family:'Shippori Mincho',serif;font-size:22px}
.card .t span{font-size:15px;color:var(--mute)}
.card .l{margin:0;font-size:14px;line-height:1.55;color:#5E554C}
.list{border-top:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row .a{flex:0 0 210px;font-family:'Shippori Mincho',serif;font-size:19px}
.row .b{flex:0 0 52px;font-size:14px;color:var(--mute)}
.row .c{flex:1 1 320px;min-width:0;font-size:15px;line-height:1.5;color:var(--soft)}
.row .e1{flex:1 1 260px;min-width:0;font-family:'Shippori Mincho',serif;font-size:19px}
.row .e3{flex:0 0 150px;font-size:14px;color:var(--mute)}
.row .e4{font-size:14px;color:var(--red)}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.box{border:1px solid var(--line);padding:26px;display:flex;flex-direction:column;gap:14px}
.box .k{margin:0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.box .k.m{color:var(--mute)}
.box .n{margin:0;font-family:'Shippori Mincho',serif;font-size:24px}
.box p.d{margin:0;font-size:15px;line-height:1.6;color:var(--soft)}
.box .bs{display:flex;flex-wrap:wrap;gap:10px;padding-top:4px}
.box .btn{padding:11px 18px;font-size:14px}
.about{display:flex;flex-wrap:wrap;gap:56px;padding-top:72px;padding-bottom:88px}
.about h2{flex:0 1 300px;font-size:42px}
.about .txt{flex:1 1 520px;min-width:0;display:flex;flex-direction:column;gap:18px;font-size:17px;line-height:1.75;color:var(--soft)}
.about p{margin:0}
.about .small{font-size:15px;color:var(--mute)}
.about .small a{border-bottom:1px solid var(--mute)}
footer{border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center;padding-top:40px;padding-bottom:40px;font-size:15px}
footer .links{display:flex;flex-wrap:wrap;gap:28px}
footer p{margin:0;color:var(--mute)}
/* project */
.proj{padding-top:8px;padding-bottom:80px;display:flex;flex-direction:column;gap:28px}
.pnav{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.pnav .pn{display:flex;gap:10px;flex-wrap:wrap}
.pnav .pn a{border:1px solid #CFC5B6;padding:9px 16px;font-size:14px;border-radius:2px}
.pbody{display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start}
.stagecol{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:14px}
.stage{background:var(--card);display:flex;align-items:center;justify-content:center;padding:20px;min-height:420px}
.stage img,.stage video{max-width:100%;max-height:78vh;object-fit:contain}
.stage video.px{width:min(100%,78vh);image-rendering:pixelated}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs button{width:76px;height:76px;padding:0;border:0;background:var(--card);overflow:hidden;cursor:pointer;opacity:.78}
.thumbs button img{width:100%;height:100%;object-fit:cover}
.thumbs button.on{opacity:1;outline:2px solid var(--ink);outline-offset:2px}
.stage{position:relative;height:min(80vh,880px);min-height:0}
.stage img,.stage video{max-height:100%!important}
.stage .sp,.stage .sn{position:absolute;top:50%;margin-top:-26px;width:52px;height:52px;border:0;border-radius:50%;background:rgba(42,38,34,.55);color:#F4EFE6;font-size:30px;line-height:1;cursor:pointer;z-index:2}
.stage .sp{left:10px}.stage .sn{right:10px}
.stage .cnt{position:absolute;left:14px;bottom:14px;font-size:12px;letter-spacing:.08em;color:var(--mute);background:rgba(244,239,230,.85);padding:4px 9px;border-radius:20px}
.stage img{cursor:pointer;-webkit-user-select:none;user-select:none}
.sbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.sbar .btn{padding:10px 18px;font-size:14px;background:none;font-family:inherit;color:var(--ink);cursor:pointer}
.sbar span{font-size:13px;color:var(--mute)}

.stage .zoom{position:absolute;right:12px;bottom:12px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(42,38,34,.72);color:#F4EFE6;font-size:20px;cursor:pointer}
.thumbs button{position:relative}
.thumbs button.anim::after{content:'▶';position:absolute;left:6px;bottom:5px;font-size:11px;color:#fff;text-shadow:0 0 4px #000}
#lb{position:fixed;inset:0;z-index:100;background:#0E0D0C;display:none}
#lb.open{display:block}
#lb .lbin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px}
#lb .lbin img,#lb .lbin video{max-width:100%;max-height:100%;object-fit:contain}
#lb .lbin video.px{width:min(100%,100vh);image-rendering:pixelated}
#lb button{position:absolute;border:0;background:rgba(255,255,255,.12);color:#F4EFE6;width:52px;height:52px;border-radius:50%;font-size:30px;line-height:1;cursor:pointer}
#lb .lbx{top:16px;right:16px}
#lb .lbp{left:16px;top:50%;margin-top:-26px}
#lb .lbn{right:16px;top:50%;margin-top:-26px}
#lb .lbc{position:absolute;left:0;right:0;bottom:14px;margin:0;text-align:center;color:#A99E90;font-size:13px}
.thumbs button{width:88px;height:88px}
.thumbs button.play{width:auto;padding:0 16px;font:500 13px Inter,sans-serif;color:var(--ink)}
aside{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:18px}
aside .yr{margin:0;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
aside h1{font-size:46px;line-height:1.1}
aside .sub{margin:0;font-family:'Shippori Mincho',serif;font-size:18px;color:var(--mute)}
aside .line{margin:0;font-size:18px;line-height:1.6}
aside .acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
aside .acts .btn{padding:12px 20px}
aside .acts .btn.red{background:var(--red);border-color:var(--red);color:var(--bg);font-weight:600}
aside .acts span{font-size:13px;color:var(--mute)}
.info{display:none;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:18px}
.info.open{display:flex}
.info p{margin:0;font-size:15.5px;line-height:1.7;color:var(--soft)}
.info p.tech{font-size:13px;line-height:1.6;color:var(--mute);border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
aside .count{margin:0;font-size:13px;color:var(--mute)}
@media (max-width:600px){.wrap{padding:0 20px}.mintband h2{font-size:40px}section.block h2,.about h2{font-size:34px}aside h1{font-size:38px}}
</style>
</head>

<script>
const DATA = [{"id": "bonjoy", "title": "BONJOY", "sub": "", "year": "2026", "line": "999 animated pixel skulls on Base, each with a small life of its own.", "info": ["Every skull is drawn in three-quarter view on a 40 by 40 grid, so the bust sits inside a round crop, shaded in 2 × 2 blocks with light from the upper left. Every hash always draws the same skull.", "Traits cover bone, background, hats, hair, clothes, eyes, mouths, companions and objects, with rules that keep each skull readable: a hood hides the hair, nothing ever covers the licking cat, a speech bubble never comes with shoulder snakes.", "Each skull loops for six seconds and has a budget for motion: no more than three things move at once. Rare effects and moments include neon light, flashes, acid that eats everything and rebuilds it, fire running from shoulder to shoulder, a Sol de Mayo, a turning galaxy, an Atari race, LED glasses with scrolling text, a worm crossing from one eye socket to the other, candles in the eyes, Zahhak's snakes growing from the shoulders, a brain sliding out of an eye socket, a scanner, a circuit board on the skin, a pixel halo with birds, a speech bubble saying gm, the Chista cat mask and a space shuttle on the back."], "tech": "JavaScript · Canvas · PNG and animated GIF", "imgs": ["img/bj1.jpg", "img/bj3.jpg", "img/bj12.jpg", "img/bj17.jpg", "img/bj6.jpg", "img/bj4.jpg", "img/bj5.jpg", "img/bj0.jpg", "img/bj2.jpg", "img/bj7.jpg", "img/bj8.jpg", "img/bj9.jpg", "img/bj10.jpg", "img/bj11.jpg", "img/bj13.jpg", "img/bj14.jpg", "img/bj15.jpg", "img/bj16.jpg", "img/bj18.jpg", "img/bj19.jpg", "img/bj20.jpg", "img/bj21.jpg", "img/bj23.jpg", "img/bj24.jpg", "img/bj25.jpg", "img/bj26.jpg"], "vids": ["img/bj1.mp4", "img/bj3.mp4", "img/bj12.mp4", "img/bj17.mp4", "img/bj6.mp4", "img/bj4.mp4", "img/bj5.mp4", "img/bj0.mp4", "img/bj2.mp4", "img/bj7.mp4", "img/bj8.mp4", "img/bj9.mp4", "img/bj10.mp4", "img/bj11.mp4", "img/bj13.mp4", "img/bj14.mp4", "img/bj15.mp4", "img/bj16.mp4", "img/bj18.mp4", "img/bj19.mp4", "img/bj20.mp4", "img/bj21.mp4", "img/bj23.mp4", "img/bj24.mp4", "img/bj25.mp4", "img/bj26.mp4"], "video": "", "released": true, "isNew": false, "ext": null}, {"id": "allaprima", "title": "Alla Prima", "sub": "", "year": "2026", "line": "Checkered cloth over hidden volumes, disturbed and then painted again in the layered method of oil painting. Every seed is a finished canvas.", "info": ["Each work begins as a real three-dimensional scene: checkered cloth draped over hidden volumes, curtains and twisted, wrapped forms, its squares coloured by the interference fields, bands and chess logic of my own palette code. The scene is then disturbed, panels shift, liquid vortices pull, ragged smears and frozen axes cut through it, collage windows open onto a second camera, and simplified so that every pixel settles on the nearest colour around it: shapes round off and no colour is invented.", "The oil engine was written specially for this work. It paints in the indirect method, session by session: imprimatura, brunaille, dead colour, softening, colour, glaze, scumble, detail, impasto lights and varnish, lean to fat, thin to thick, broad to specific. Every film of paint is an optical layer that absorbs and scatters light, so a thin film is translucent, dark paint glazes and white-rich paint covers.", "The brush is a flat or filbert of fine bristles, each with its own load of paint; it runs dry and drags the wet paint it crosses, wet into wet. It works like a painter, not from top to bottom but shape by shape, wandering over the canvas. The linen has a hand-cut edge about a centimetre inside the border, and the varnish is uneven, glossy in the darks and matt where the paint is lean. The same seed paints the same picture, bit for bit, on a phone, a tablet, a laptop or a television."], "tech": "JavaScript · WebGL2 · custom oil-paint engine · images up to 8K, 4K GIF and video of the painting process", "imgs": ["img/ap-7777p.jpg", "img/ap-1588p.jpg", "img/ap-1234.jpg", "img/ap-11111p.jpg", "img/ap-3317.jpg", "img/ap-4096p.jpg", "img/ap-50505p.jpg", "img/ap-311.jpg", "img/ap-6262.jpg", "img/ap-42p.jpg", "img/ap-31415.jpg", "img/ap-2401.jpg", "img/ap-905.jpg", "img/ap-23456.jpg", "img/ap-8123.jpg"], "vids": ["img/ap-7777p.mp4", "", "", "", "", "", "", "", "", "", "", "", "", "", ""], "video": "img/ap-7777p.mp4", "released": false, "isNew": true, "ext": null}, {"id": "divoni", "title": "Divoni", "sub": "ディヴォニ", "year": "2026", "line": "Legendary Japanese warriors from more than a hundred of my drawings, painted live in watercolour on aged washi.", "info": ["The figures come from 48 of my original designs, broken into crests, halos, faces, eyes, beards and armour, then joined again in mirror symmetry. Every number gives a warrior who never existed, but every line in him was drawn by hand.", "Each piece of the drawing carries three colours measured from its own painting: a shadow side, a body and a lit side, with warm light and cool violet shadow, so the hue shifts of the originals survive.", "The watercolour engine was written for this work as custom GLSL shaders on WebGL2. Pigment is treated as density on the paper: it flows where the sheet is wet, piles up at the drying edge, blooms, granulates, and warm dyes travel further than blue. Water runs freely through crests and feathers, less in the armour, and stops at the eyes, so the gaze stays sharp. Each sheet is mounted on hand-made Japanese paper with kozo fibres and slow tea-coloured toning, then signed and sealed."], "tech": "JavaScript · WebGL2 · custom watercolour and washi shaders · exports up to 8×", "imgs": ["img/divoni-0.jpg", "img/divoni-n1.jpg", "img/divoni-n7.jpg", "img/divoni-n6.jpg", "img/divoni-n3.jpg", "img/divoni-n4.jpg", "img/divoni-n5.jpg", "img/divoni-3.jpg", "img/divoni-2.jpg", "img/divoni-n2.jpg"], "vids": ["", "", "", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null}, {"id": "cubist", "title": "Cubist Portraits", "sub": "", "year": "2026", "line": "One hash, one woman: portraits built from broken planes in wet-on-wet pastel.", "info": ["Every work holds one woman, close up, at the shoulders, seated or full length. She is assembled from a library of faceted parts: heads, eyes, mouths, hair, hats, collars, hands, gowns, chairs and rooms. One half of a face may come from one type and the other half from another.", "Cuts at fixed angles, stepped and rotary, slide the figure and the ground along the same lines. Form comes from colour contrast rather than outline: planes alternate lighter and darker inside each part.", "The surface is wet-on-wet pastel with pencil layers and a felt-like grain. The frame takes its colour from each palette. Every later addition has its own random stream, so new features never change earlier works. Renders are drawn again in tiles, so a 16K print matches the preview exactly."], "tech": "JavaScript · Canvas & WebGL · custom pastel shader · exports up to 16K", "imgs": ["img/cubist-6.jpg", "img/cubist-2.jpg", "img/cubist-n0.jpg", "img/cubist-4.jpg", "img/cubist-n2.jpg", "img/cubist-7.jpg", "img/cubist-n3.jpg", "img/cubist-n8.jpg", "img/cubist-1.jpg", "img/cubist-n5.jpg", "img/cubist-n11.jpg", "img/cubist-8.jpg", "img/cubist-n1.jpg", "img/cubist-n6.jpg", "img/cubist-9.jpg"], "vids": ["", "", "", "", "", "", "", "", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null}, {"id": "boro", "title": "Boro", "sub": "ぼろ 2026", "year": "2026", "line": "Generative embroidery: scraps of cloth gathered and stitched, and the cloth can be turned over to see its back.", "info": ["After the Japanese habit of mending worn cloth, each work gathers patches of linen, kasuri and printed fabrics and joins them with running stitches. You watch the piece being sewn, stitch by stitch.", "The Back view turns the textile over and shows the reverse of the same stitching. A Light view lifts the cloth against the light. Palette families range from indigo and kintsugi gold to market prints and linen whites. Rare classes leave the patchwork behind: a koi pond where one great fish is pieced from scraps, kintsugi gold, aizome indigo, imperial blue and gin silver.", "Written in plain JavaScript with Canvas 2D and a custom WebGL pass for thread and fibre."], "tech": "JavaScript · Canvas 2D & WebGL · exports up to 16K and animated GIF", "imgs": ["img/boro-h0.jpg", "img/boro-h1.jpg", "img/boro-h9.jpg", "img/boro-h3.jpg", "img/boro-h4.jpg", "img/boro-h5.jpg", "img/boro-h2.jpg", "img/boro-h7.jpg", "img/boro-h11.jpg", "img/boro-h13.jpg", "img/boro-h15.jpg", "img/boro-h6.jpg", "img/boro-h8.jpg", "img/boro-h10.jpg", "img/boro-h12.jpg", "img/boro-h14.jpg", "img/boro-1.jpg"], "vids": ["", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""], "video": "img/boro-anim.mp4", "released": false, "isNew": false, "ext": null}, {"id": "simorgh", "title": "Simorgh", "sub": "", "year": "2026", "line": "Abstract paintings of the mythical bird: ribbons, feathers and eyes inside manuscript frames.", "info": ["Simorgh is the bird at the end of the journey in the old Persian poem of the birds. Here she appears as a wing, a head, a flower, a spread or a tree, built from long painted ribbons, teardrop eyes and feather patterns.", "Compositions follow the golden spiral. The frames come from Persian manuscripts, and trees sometimes grow through their borders. Grounds range from raw linen and watercolour on lilac paper to gouache on cream and lapis with gold, in natural, psychedelic or negative moods. Three moods run through the series: natural colour, a rare negative that turns the whole painting into a single tinted tone, and a psychedelic one.", "Every brushstroke is drawn with layered, graded colour. Prints are made at up to 16K."], "tech": "JavaScript · Canvas · exports up to 16K", "imgs": ["img/simorgh-n1.jpg", "img/simorgh-n101.jpg", "img/simorgh-n105.jpg", "img/simorgh-1.jpg", "img/simorgh-n102.jpg", "img/simorgh-n2.jpg", "img/simorgh-n103.jpg", "img/simorgh-n3.jpg", "img/simorgh-n106.jpg", "img/simorgh-n8.jpg", "img/simorgh-n100.jpg", "img/simorgh-n0.jpg", "img/simorgh-n111.jpg", "img/simorgh-n104.jpg", "img/simorgh-n7.jpg", "img/simorgh-n112.jpg"], "vids": ["", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null}, {"id": "niwa", "title": "Niwa", "sub": "庭", "year": "2026", "line": "A Japanese garden drawn in one even line, through seasons, weather and print modes.", "info": ["Each seed builds a garden and chooses how to look at it: the house and garden, a koi pond, a bamboo grove, a flower field, a reed thicket, a bonsai, a temple or pagoda, Mount Fuji, a sakura bough.", "Every stroke has the same width. Stones are split into faceted planes and hatched in their own directions; lanterns and basins are turned like objects on a lathe; when the camera sits low in the reeds, the garden shows only between their leaves. Seasons and weather add rain, snow, falling petals or leaves and passing birds.", "The same drawing can be printed in sumi black, black and gold, navy and blue, dark green, watercolour or risograph."], "tech": "JavaScript · vector line engine · exports up to 8K", "imgs": ["img/niwa-n110.jpg", "img/niwa-n106.jpg", "img/niwa-n104.jpg", "img/niwa-n102.jpg", "img/niwa-n101.jpg", "img/niwa-n112.jpg", "img/niwa-n103.jpg", "img/niwa-n105.jpg", "img/niwa-n109.jpg", "img/niwa-n107.jpg", "img/niwa-n108.jpg", "img/niwa-n111.jpg", "img/niwa-1.jpg", "img/niwa-2.jpg"], "vids": ["", "", "", "", "", "", "", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null}, {"id": "gunta", "title": "Gunta Rug", "sub": "Square", "year": "2026", "line": "Square deep-pile rugs, woven in yarn and rendered tuft by tuft.", "info": ["Gunta Square reads its structure from three reference rugs, the pink and green rugs and the red check. An outer border one module wide is built from pieces whose breaks line up with the divisions inside; an inner frame of small forms follows, striped clusters, yellow, dark and cream blocks, violet squares and salmon strips; and the field takes one of two grammars, stepped bands of colour like the pink rugs, or a mirrored check of wide fields and narrow strips like the red one.", "Colour comes from forty yarn palettes. The rows are never straight: like a hand-knotted gabbeh they swell, thin and drift, with pixel spots, single knots and a woven signature.", "The pile is drawn by Gunta Pile, a renderer written specially for this work. For every pixel it travels down through a four-centimetre pile, from the tips to the foundation, and finds the tuft whose fibres reach that point. Each knot is a bundle of fibres that bends with the nap, narrows at the tip and splits into finer strands; deep fibres fall into shadow, sun-dried tips catch a soft anisotropic sheen, roots are darker, and a short shadow is traced toward the light. The rug is rendered in tiles, so an 8K print keeps every fibre."], "tech": "JavaScript · WebGL · custom deep-pile shader · exports up to 8K", "imgs": ["img/gunta-1.jpg", "img/gunta-2.jpg", "img/gunta-3.jpg", "img/gunta-4.jpg", "img/gunta-5.jpg", "img/gunta-6.jpg", "img/gunta-7.jpg", "img/gunta-8.jpg"], "vids": ["", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null}, {"id": "ryuka", "title": "Ryūka", "sub": "竜火", "year": "2026", "line": "Geometric watercolours in which a legendary beast, a dragon or a lion-dog, rises out of the painting itself and breathes fire.", "info": ["Ryūka means dragon fire. Thirty-two of my paintings were analysed and gave eleven new ways to compose a sheet: layered bands, sliding columns, linear mosaic, chains, ring grids, zones, islands, machine strips, a torn continent and tiles. The palettes were measured from the same paintings.", "The beasts are large, readable figures built in the painting's own language of squares, triangles, circles and patchwork, dressed in traditional Japanese patterns: uroko, seigaiha, kikkō, asanoha, shippō, yagasuri, igeta, kanoko, ichimatsu and hishi. The head is a patchwork block with rows of teeth, a long snout, upper and lower jaws and a wind-blown mane, and the fire comes from inside the mouth. A hidden skeleton grows and hundreds of patterned modules gather around it, and beside the beast a territory is built: one great city and a few small towns.", "Random fractures slide bands, columns and blocks out of place. The watercolour gives each part its own wetness: a wet ground, very wet masses, and dry, sharp objects."], "tech": "JavaScript · WebGL2 · custom watercolour shaders · exports up to 6K", "imgs": ["img/ryuka-2.jpg", "img/ryuka-n4.jpg", "img/ryuka-5.jpg", "img/ryuka-n2.jpg", "img/ryuka-n6.jpg", "img/ryuka-n1.jpg", "img/ryuka-n5.jpg", "img/ryuka-n0.jpg", "img/ryuka-3.jpg", "img/ryuka-n7.jpg", "img/ryuka-n11.jpg", "img/ryuka-n8.jpg", "img/ryuka-6.jpg", "img/ryuka-n3.jpg"], "vids": ["", "", "", "", "", "", "", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null}, {"id": "hanabi", "title": "Hanabi", "sub": "花火", "year": "2026", "line": "Real three-dimensional flowers on a broken, cubist ground, inked in hatching, each with a coloured halo behind it like a firework.", "info": ["Hanabi means fireworks. Petals, sepals, buds, leaves and stems are built as true 3D forms, and every kind of plant has its own genome, a range of real botanical measurements. They are placed with care for collisions: flower heads first, then branches and leaves that never cut through a bloom.", "The ground is a cubist partition taken from my own paintings, sometimes a collage split by one or two long cuts or a great ring. The 3D scene is then turned into ink that follows the tone of the image: stipple, dashes, knots, mazes and flow lines, and an engraved mode where tone is split into eight bands, each adding a turned, waving layer of lines. Flowers and leaves have no outline; the hatching of the cells that touch them draws their edge.", "A watercolour wash, fine fibres in the seams and marks of weather finish each sheet. Each sheet takes a mood, day, dawn, autumn, night, misty rain, winter snow, sumi ink with a single red, or kintsugi gold in the seams, and a structure for the glass, from starbursts and lattices to rings, fans and shatter."], "tech": "JavaScript · WebGL2 · custom ink and watercolour rendering · exports up to 8K", "imgs": ["img/hanabi-n110.jpg", "img/hanabi-n101.jpg", "img/hanabi-n104.jpg", "img/hanabi-n103.jpg", "img/hanabi-n108.jpg", "img/hanabi-n100.jpg", "img/hanabi-n105.jpg", "img/hanabi-n106.jpg", "img/hanabi-n2.jpg", "img/hanabi-n111.jpg", "img/hanabi-n109.jpg", "img/hanabi-n4.jpg", "img/hanabi-n112.jpg", "img/hanabi-n7.jpg", "img/hanabi-n10.jpg", "img/hanabi-n3.jpg"], "vids": ["", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null}, {"id": "mugen", "title": "Mugen", "sub": "夢幻", "year": "2026", "line": "Islands of knots, snakes, spirals, braids and twisted forms, painted over their volume on a sheet of paper inside a ruled margin.", "info": ["Mugen means dream and illusion. It grows out of my Tangle engine: the creature from Mewed, the captive Simorgh with its room, body, tendrils and hair, was carried into it and tied together with knots.", "The forms come from a vocabulary of their own: Lissajous knots, calligraphic C and S strokes, vines, beaded knotted tubes, baskets and ribbed cages, flower-like horns with eyes, coiled snakes, kuru spirals, braided hair and patched balloons. Japanese objects drift among them, a lattice gate, a wagasa umbrella, a sensu fan, a chōchin lantern, a koinobori carp, an ensō circle, mizuhiki knots, a shimenawa rope and kinoko mushrooms, each dressed in one of twenty-three surfaces, from gradients, stripes and marbled dye to ichimatsu, seigaiha, shippō, uroko, asanoha, kikkō, sayagata, sakura, kiku, karakusa and ryūsui.", "Some sheets gather everything into a single island floating on bare paper; others come close and fill the whole sheet. A third of the frame is often left to quiet watercolour wash, and focal points are built in finer detail so they hold up when you come near. The paper takes its colour and relief from real sheets, with control over wetness, salt and grain, and every work is signed twice in pencil, slightly out of register, with the kanji 夢幻."], "tech": "JavaScript · WebGL2 · custom paint and paper rendering · exports up to 6K", "imgs": ["img/mugen-1.jpg", "img/mugen-4.jpg", "img/mugen-6.jpg", "img/mugen-3.jpg", "img/mugen-7.jpg", "img/mugen-13.jpg", "img/mugen-8.jpg", "img/mugen-11.jpg", "img/mugen-10.jpg", "img/mugen-2.jpg"], "vids": ["", "", "", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null}, {"id": "deepgarden", "title": "Deep Garden", "sub": "", "year": "2026", "line": "Underwater watercolours of imagined creatures, reefs, corals and sea plants, in the colours of late Kandinsky.", "info": ["The raw material is 255 of my own drawings of sea creatures. The creatures in the work are neither copies nor collages of them: every outline was aligned and measured, and their differences were reduced to 28 genes that explain almost all of the variation. A new creature is a new point in that 28-dimensional space, born rather than assembled.", "A second set of measurements reads what I draw inside the bodies, cells, spots, stripes, eyes and checks, and a small grammar fills each new body with the same habits: single trunks, segmented bodies, worms, coils and plant-like forms, with heads, eyes, mouths and up to three kinds of limbs. Sunken ships come from their own genome, taken from ten of my wreck drawings. The sea floor grows round, puffed plants alongside brain coral, staghorn, sea fans, kelp, sponges and anemones.", "About fifty scene archetypes, a shoal, a reef, a whirlpool, a cave, a kelp forest, the surface, an ascent, cells and bubbles, decide how the garden is arranged, and nothing is allowed to overlap. The watercolour, written for this work, paints in four layers, ground, middle, detail and material, with paper relief, flowing water, wet edges, grain and varnish. The signature sits in watercolour just below the window."], "tech": "JavaScript · Canvas 2D & WebGL2 · custom watercolour shaders · exports up to 8K", "imgs": ["img/deepgarden-2.jpg", "img/deepgarden-n0.jpg", "img/deepgarden-4.jpg", "img/deepgarden-n1.jpg", "img/deepgarden-1.jpg", "img/deepgarden-n6.jpg", "img/deepgarden-n11.jpg", "img/deepgarden-3.jpg", "img/deepgarden-n4.jpg", "img/deepgarden-n2.jpg", "img/deepgarden-5.jpg", "img/deepgarden-n10.jpg", "img/deepgarden-n8.jpg", "img/deepgarden-n9.jpg"], "vids": ["", "", "", "", "", "", "", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null}, {"id": "polaroid", "title": "Polaroid Long Exposure", "sub": "", "year": "2026", "line": "Night roads outside the city, seen by a photographer who is moving too: the horizon holds still while signs, lamps and headlights stretch and wave.", "info": ["Polaroid Long Exposure rebuilds an earlier series of mine, a night drive photographed from inside a moving bus, as a real three-dimensional world. Each picture is a true long exposure, the average of many sub-frames: the bus, the cars and the camera all move while the shutter is open. The camera rests most of the time, then the hand shakes, and that tremor is written into the lights.", "The world is drawn from real rules. Road signs follow each country's own system, European, American, Japanese, Korean or Chinese, and motorway signs take their country's blue or green. Trees come from species that grow in that region, the land rises and falls like the place it stands for, and sodium lamps line the road.", "After the exposure, a film and emulsion stage written for this work develops the picture. Its failures were modelled on real damaged Polaroids: a burst reagent pod, streaks, lifting, blooming and decay, then archival ageing, silvering, stains and fading. Every image sits on a true Polaroid 600 card, 88 × 107 mm with a 79 mm square window, with its reagent pocket, chemical traces, edge codes and a few small pencil notes."], "tech": "JavaScript · WebGL · custom exposure and emulsion shaders · PNG up to 8K and an animated print that develops", "imgs": ["img/polaroid-1.jpg", "img/polaroid-n4.jpg", "img/polaroid-3.jpg", "img/polaroid-n6.jpg", "img/polaroid-n10.jpg", "img/polaroid-4.jpg", "img/polaroid-n2.jpg", "img/polaroid-n5.jpg", "img/polaroid-n7.jpg", "img/polaroid-n3.jpg"], "vids": ["", "", "", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null}, {"id": "kumo", "title": "Kumo", "sub": "", "year": "2026", "line": "Generative marbled sheets: inks dropped, combed and stirred, in large panels and the vivid palettes of painters.", "info": ["Kumo belongs to my Mapen family, and its genome was measured from 85 of my works. The marbling is mathematical: drops of ink, combs, wavy combs, whirlpools and radial bursts, each with an exact inverse, so every pixel can be traced back to the drop it came from.", "A sheet is built from a few large panels, 2 × 2, two halves, three to one, sometimes mirrored, each with its own technique and cut, inside a grid of full, empty, single-colour, lighter, shifted and grey tiles, or a fine mosaic. Feathered fork combs pull sharp, hooked plumes.", "Twenty-four palettes come from painters who set many colours side by side, each with the ground it sings on: Chagall, Klimt, Matisse, Kandinsky, Klee, Delaunay, Franz Marc, Kirchner, Gauguin, Hundertwasser, Hilma af Klint, Persian miniature, Isfahan tile, Byzantium, ukiyo-e, a Mexican market, Miró and a Fauve sea, alongside psychedelic poster palettes and strong coloured grounds. The paint sits on aged paper: coloured pencil on the tooth of the sheet, a brown halo between inks, ghost lines on bare paper, grain and texture. The same hash paints the same sheet on every device."], "tech": "JavaScript · custom marbling and paper engine · Save 4K and Print 8K", "imgs": ["img/kumo-1.jpg", "img/kumo-n5.jpg", "img/kumo-2.jpg", "img/kumo-n3.jpg", "img/kumo-n8.jpg", "img/kumo-n9.jpg", "img/kumo-3.jpg", "img/kumo-n11.jpg", "img/kumo-n2.jpg", "img/kumo-n1.jpg", "img/kumo-n4.jpg", "img/kumo-n10.jpg", "img/kumo-4.jpg", "img/kumo-n7.jpg"], "vids": ["", "", "", "", "", "", "", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null}, {"id": "mewed", "title": "Mewed", "sub": "", "year": "2026", "line": "Captive Simorgh: an intaglio print in which a bird grows inside a skewed box and is pressed against its walls.", "info": ["Mewed is printed in the manner of Stanley William Hayter's plates of the 1940s. The front opening of the room never moves, a clean rectangle one centimetre inside the plate mark; only the back wall moves, so every work has its own depth.", "The bird takes its vocabulary from Simorgh, swollen blades, whips, clubs, spiral curls at the tips and knots, but this time it grows in three dimensions. The body rises from a back corner, wings and tail open, and wherever a path meets a wall it flattens and slides along it, as if the bird were pressed into the room and melting onto it. Bodies painted by the Dotō engine are turned into 3D forms: from the viewer's eye they are exactly that painting, yet they bend and overlap in depth.", "The plate surface was measured from real plates: the ink film and wiped windows, the marks of the tarlatan, thousands of fine scratches. The print uses aquatint bitten in twenty-nine levels, soft-ground texture, spit-bite and foul-bite, burin, white scorper lines and the burnished rays on a dark ground that sign Hayter's plates. The title is written by hand in pencil, each letter traced again with an unsteady hand, and the signature is blind-stamped below the plate mark."], "tech": "JavaScript · WebGL2 · custom etching shaders · exports up to 8K", "imgs": ["img/mewed-3.jpg", "img/mewed-n3.jpg", "img/mewed-1.jpg", "img/mewed-n4.jpg", "img/mewed-n11.jpg", "img/mewed-2.jpg", "img/mewed-n6.jpg", "img/mewed-n0.jpg", "img/mewed-n5.jpg", "img/mewed-5.jpg", "img/mewed-n7.jpg", "img/mewed-n9.jpg"], "vids": ["", "", "", "", "", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null}, {"id": "doto", "title": "Dotō", "sub": "怒涛", "year": "2026", "line": "A surge of paint: abstract paintings in which marks, handwriting and forms repeat, gather and break.", "info": ["Dotō means a raging surge. The work rests on a set of recurring rules rather than a single picture. A stroke is laid down, then repeated with a slight change, and repeated again, until the repetition becomes a wave.", "Handwriting runs through the pattern and never stays the same: letters loosen, drift and are overwritten as the painting grows. Unexpected forms rise out of the surge, a cluster, a diagonal, a vessel, a hanging shape or a buried mass, and the rules build each of them layer over layer, leaving a raw paper margin around the painting like the edge of a sheet pinned to the studio wall.", "The painting can be watched as it is made, stroke after stroke, the way it would happen in front of the easel."], "tech": "JavaScript · Canvas", "imgs": ["img/doto-1.jpg", "img/doto-2.jpg", "img/doto-3.jpg", "img/doto-4.jpg", "img/doto-5.jpg"], "vids": ["", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null}, {"id": "sohrab", "title": "Sohrab’s Trees", "sub": "", "year": "2026", "line": "In memory of Sohrab Sepehri: ink-wash forests in mist and snow, where small animals sleep among the trunks.", "info": ["Sohrab’s Trees is made in memory of Sohrab Sepehri (1928–1980), the Iranian poet and painter, who painted tree trunks again and again. For him a tree was a quiet way of being in the world; in this series the branches hold thoughts that cannot be seen, and the leaves carry pieces of poems that were never written.", "Each seed grows its own forest: ridges, boulders, odd trees and quiet clearings, washed in ink the way a brush would lay them down. Palettes run from ink grey and celadon to silver, gold and black ridges, midnight, crimson and a rare rainbow. Mist and snow soften the distance, and somewhere in the trees a small animal is asleep.", "The ink and the paper are written for this work, so every forest keeps the slow, wet feeling of a painted scroll."], "tech": "JavaScript · custom ink-wash renderer", "imgs": ["img/sohrab-d8.jpg", "img/sohrab-d0.jpg", "img/sohrab-d4.jpg", "img/sohrab-d1.jpg", "img/sohrab-d6.jpg", "img/sohrab-d12.jpg", "img/sohrab-d5.jpg", "img/sohrab-d15.jpg", "img/sohrab-d11.jpg", "img/sohrab-d7.jpg", "img/sohrab-d14.jpg", "img/sohrab-d3.jpg"], "vids": ["", "", "", "", "", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": {"label": "Watch it live on Highlight", "note": "Showcase only · mint closed", "url": "https://highlight.xyz/mint/01a13c74-ade8-7036-97b6-18742c2552b4"}}, {"id": "cubegirls", "title": "Cube Girls in Line", "sub": "", "year": "2026", "line": "The women of Cubist Portraits, drawn only in line on an old sheet.", "info": ["Cube Girls are cubist portraits of women, each one a chimera assembled from different parts. The grammar was read from forty-six of my reference studies, and the palettes come from forty-seven of my Atelier files.", "Over its versions the figure changed from a hidden map that lends colour and direction to a cubist grid, every region seeing her from a slightly different angle, to a figure made only of the code's own geometry, flat-edged planes, broken shards and half-moons, cut by three cubist operations: a diagonal cut, a step and a radial turn.", "It now draws from a library of parts: heads; faces that are double, halved, crescent with a snout, broken, checked or masked; eyes and noses; mouths and cubist smiles; hair; hats, straw, beret, flowered, tricorn; collars, gowns, and jointed hands that make the two halves of a heart. Rare traits include a Picasso profile with the eye in front, a halo, a flower behind the ear, jewellery and a full-length figure. Each trait has its own random stream, so switching one off leaves every other work exactly as it was."], "tech": "JavaScript · Canvas · exports up to 8K", "imgs": ["img/cubegirls-1.jpg", "img/cubegirls-n1.jpg", "img/cubegirls-n9.jpg", "img/cubegirls-n10.jpg", "img/cubegirls-n5.jpg", "img/cubegirls-2.jpg", "img/cubegirls-n6.jpg", "img/cubegirls-n4.jpg", "img/cubegirls-4.jpg", "img/cubegirls-n7.jpg", "img/cubegirls-n2.jpg", "img/cubegirls-n11.jpg"], "vids": ["", "", "", "", "", "", "", "", "", "", "", ""], "video": "", "released": false, "isNew": false, "ext": null}];

function project(id) {
  const i = DATA.findIndex(d => d.id === id), p = DATA[i];
  const prev = DATA[(i - 1 + DATA.length) % DATA.length], next = DATA[(i + 1) % DATA.length];
  const nAnim = p.vids.filter(v => v).length;
  const count = p.id === 'bonjoy' ? p.imgs.length + ' animated outputs, each a six-second loop' : p.imgs.length + ' outputs shown' + (nAnim ? ' · ' + nAnim + ' animated' : '') + (p.video ? ' · one recording' : '');
  const label = p.isNew ? ' · new, not yet released' : '';
  return `<div class="wrap proj">
<div class="pnav"><a href="#works" style="padding:10px 0;font-size:15px">← All works</a><div class="pn"><a href="#p/${prev.id}">← ${esc(prev.title)}</a><a href="#p/${next.id}">${esc(next.title)} →</a></div></div>
<div class="pbody"><div class="stagecol"><div class="stage" id="stage"></div>
<div class="sbar"><button class="btn" id="slide">▶ Slideshow</button><span>Tap the image or swipe for the next output</span></div><div class="thumbs">${p.imgs.map((s, n) => `<button data-n="${n}" aria-label="Output ${n + 1}"${p.vids[n] && p.id !== 'bonjoy' ? ' class="anim"' : ''}><img loading="lazy" src="${s}" alt=""></button>`).join('')}${p.video ? '<button class="play" data-n="video">▶ Watch it paint</button>' : ''}</div></div>
<aside><p class="yr">${p.year}${label}</p><h1>${esc(p.title)}</h1>${p.sub ? `<p class="sub">${esc(p.sub)}</p>` : ''}<p class="line">${esc(p.line)}</p>
${p.released ? `<div class="acts"><a class="btn red" href="${L.mint}">Mint</a><a class="btn" href="${L.opensea}">OpenSea</a></div>` : ''}
${p.ext ? `<div class="acts"><a class="btn" href="${p.ext.url}">${esc(p.ext.label)} →</a><span>${esc(p.ext.note)}</span></div>` : ''}
<div class="acts"><a class="btn" href="#" id="infobtn">Info</a></div>
<div class="info" id="info">${p.info.map(t => `<p>${esc(t)}</p>`).join('')}<p class="tech">${esc(p.tech)}</p></div>
<p class="count">${count}</p></aside></div></div>`;
}

let cur = null;
const lb = document.createElement('div'); lb.id = 'lb';
lb.innerHTML = '<div class="lbin"></div><button class="lbx" aria-label="Close">×</button><button class="lbp" aria-label="Previous">‹</button><button class="lbn" aria-label="Next">›</button><p class="lbc"></p>';
document.body.appendChild(lb);
function lbItems(p) { const a = p.imgs.map((s, n) => n); if (p.video) a.push('video'); return a; }
function lbRender() {
  const { p, n } = cur, box = lb.querySelector('.lbin');
  if (n === 'video') box.innerHTML = `<video src="${p.video}" autoplay loop muted playsinline controls></video>`;
  else if (p.vids[n]) box.innerHTML = `<video${p.id === 'bonjoy' ? ' class="px"' : ''} src="${p.vids[n]}" poster="${p.imgs[n]}" autoplay loop muted playsinline></video>`;
  else box.innerHTML = `<img src="${p.imgs[n]}" alt="">`;
  const it = lbItems(p); lb.querySelector('.lbc').textContent = (it.indexOf(n) + 1) + ' / ' + it.length;
}
function openLb() { lb.classList.add('open'); document.body.style.overflow = 'hidden'; lbRender(); }
function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; lb.querySelector('.lbin').innerHTML = ''; if (cur) show(cur.p, cur.n); }
function step(d) { const it = lbItems(cur.p); const i = (it.indexOf(cur.n) + d + it.length) % it.length; cur.n = it[i]; lbRender(); }
lb.querySelector('.lbx').onclick = closeLb;
lb.querySelector('.lbp').onclick = e => { e.stopPropagation(); step(-1); };
lb.querySelector('.lbn').onclick = e => { e.stopPropagation(); step(1); };
lb.querySelector('.lbin').onclick = e => { if (e.target === e.currentTarget) closeLb(); };
let tx = null, ty = null;
lb.addEventListener('touchstart', e => { if (e.touches.length === 1) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; } else tx = null; }, { passive: true });
lb.addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1); else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) closeLb(); });
document.addEventListener('keydown', e => { if (!lb.classList.contains('open')) return; if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); });

function show(p, n) {
  const st = $('#stage');
  let html;
  if (n === 'video') html = `<video src="${p.video}" autoplay loop muted playsinline controls></video>`;
  else if (p.vids[n]) html = `<video${p.id === 'bonjoy' ? ' class="px"' : ''} src="${p.vids[n]}" poster="${p.imgs[n]}" autoplay loop muted playsinline controls></video>`;
  else html = `<img src="${p.imgs[n]}" alt="${esc(p.title)}, output ${n + 1}">`;
  const it = lbItems(p), k = it.indexOf(n);
  st.innerHTML = html + `<button class="sp" aria-label="Previous">‹</button><button class="sn" aria-label="Next">›</button><button class="zoom" aria-label="View full screen">⤢</button><span class="cnt">${k + 1} / ${it.length}</span>`;
  cur = { p, n };
  const go = d => { stopAuto(); show(p, it[(k + d + it.length) % it.length]); };
  st.querySelector('.sp').onclick = e => { e.stopPropagation(); go(-1); };
  st.querySelector('.sn').onclick = e => { e.stopPropagation(); go(1); };
  st.querySelector('.zoom').onclick = e => { e.stopPropagation(); openLb(); };
  const im = st.querySelector('img'); if (im) im.onclick = e => { const r = im.getBoundingClientRect(); go(e.clientX - r.left < r.width / 3 ? -1 : 1); };
  st.ontouchstart = e => { if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } else sx = null; };
  st.ontouchend = e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { e.preventDefault(); go(dx < 0 ? 1 : -1); } };
  
  document.querySelectorAll('.thumbs button').forEach(b => b.classList.toggle('on', String(b.dataset.n) === String(n)));
}
let sx = null, auto = null;
function stopAuto() { if (auto) { clearInterval(auto); auto = null; const b = $('#slide'); if (b) b.textContent = '▶ Slideshow'; } }
function toggleAuto() {
  if (auto) return stopAuto();
  const b = $('#slide'); b.textContent = '❚❚ Pause';
  auto = setInterval(() => { if (!cur || !document.body.contains($('#stage'))) return stopAuto(); const it = lbItems(cur.p).filter(x => x !== 'video'); const i = it.indexOf(cur.n); const nx = it[(i + 1) % it.length]; const a = auto; show(cur.p, nx); auto = a; }, 3500);
}

function route() {
  const h = location.hash.slice(1);
  if (h.startsWith('p/') && byId(h.slice(2))) {
    const p = byId(h.slice(2));
    app.innerHTML = project(p.id);
    document.title = p.title + ' — Chista';
    show(p, 0);
    stopAuto();
    document.querySelectorAll('.thumbs button').forEach(b => b.onclick = () => { stopAuto(); show(p, b.dataset.n === 'video' ? 'video' : +b.dataset.n); $('#stage').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); });
    $('#slide').onclick = toggleAuto;
    $('#infobtn').onclick = e => { e.preventDefault(); const o = $('#info').classList.toggle('open'); e.target.textContent = o ? 'Close info' : 'Info'; };
    window.scrollTo(0, 0);
  } else {
    if (!$('#works')) { app.innerHTML = home(); document.title = 'Chista — generative paintings'; }
    const el = h && document.getElementById(h);
    if (el) el.scrollIntoView(); else if (!h) window.scrollTo(0, 0);
  }
}
window.addEventListener('hashchange', route);
route();
</script>
